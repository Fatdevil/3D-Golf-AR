<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenRead - Course Editor</title>
<style>
  body { margin: 0; padding: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; }
  #map { width: 75vw; height: 100vh; }
  #sidebar { width: 25vw; padding: 20px; box-sizing: border-box; overflow-y: auto; background: #252526; border-left: 1px solid #333; }
  
  h2 { font-size: 20px; margin-top: 0; color: #4ade80; border-bottom: 2px solid #333; padding-bottom: 10px; }
  .control-group { margin-bottom: 20px; background: #333; padding: 15px; border-radius: 8px; }
  label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #ccc; }
  select, input, button { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #555; background: #1e1e1e; color: #fff; font-family: inherit; }
  button { background: #4ade80; color: #000; font-weight: bold; cursor: pointer; border: none; transition: background 0.2s; }
  button:hover { background: #22c55e; }
  
  .type-btn { padding: 10px; margin-bottom: 5px; text-align: left; background: #1e1e1e; font-weight: normal; color: #ddd; border-left: 5px solid transparent; }
  .type-btn.active { font-weight: bold; }
  .type-btn.fairway.active { border-color: #4ade80; background: rgba(74, 222, 128, 0.1); }
  .type-btn.rough.active { border-color: #166534; background: rgba(22, 101, 52, 0.1); }
  .type-btn.sand.active { border-color: #fcd34d; background: rgba(252, 211, 77, 0.1); }
  .type-btn.water.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
  .type-btn.tree.active { border-color: #a21caf; background: rgba(162, 28, 175, 0.1); }
  .type-btn.green.active { border-color: #bef264; background: rgba(190, 242, 100, 0.1); }
  .type-btn.ob.active { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); text-transform: uppercase; }
  .type-btn.tee.active { border-color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
  .type-btn.waste.active { border-color: #d97706; background: rgba(217, 119, 6, 0.1); }
  
  .tree-options { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #555; }
  
  #json-output { width: 100%; height: 200px; background: #000; color: #4ade80; border: 1px solid #333; resize: none; padding: 10px; font-family: monospace; font-size: 11px; margin-top: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="map"></div>
<div id="sidebar">
  <h2>🛠️ Course Mod Editor</h2>
  
  <div class="control-group">
    <label>1. Välj Hål Att Redigera</label>
    <select id="hole-select"></select>
  </div>
  
  <div class="control-group">
    <label>2. Välj Yta Att Rita</label>
    <button class="type-btn tee" onclick="setType('TEE')">🟦 Tee-box (Kortklippt Utslag)</button>
    <button class="type-btn green" onclick="setType('GREEN')">⛳ Green (Snabbt rull)</button>
    <button class="type-btn fairway" onclick="setType('FAIRWAY')">🏌️ Fairway (Normal studs)</button>
    <button class="type-btn rough" onclick="setType('ROUGH')">🌿 Ruff (Dämpar bollen)</button>
    <button class="type-btn sand" onclick="setType('SAND')">🏖️ Bunker (Bollen splattar dött)</button>
    <button class="type-btn waste" onclick="setType('WASTE')">🏜️ Waste Area (Hård/Grusig Sand)</button>
    <button class="type-btn water" onclick="setType('WATER')">💧 Vatten (Dropp / Plask)</button>
    <button class="type-btn tree" onclick="setType('TREE')">🌲 Skogsdunge (Fysiskt Hinder)</button>
    <button class="type-btn ob" onclick="setType('OB')">🔴 Out of Bounds (Förbjuden gräns!)</button>
    
    <div class="tree-options" id="tree-options">
      <label>Ungefärlig Trädhöjd (meter):</label>
      <input type="number" id="tree-height" value="15" min="2" max="50">
      <small style="color:#aaa; font-size:11px;">Om bollen färdas under denna höjd när den är inne i zonen krockar den i grenarna.</small>
    </div>
  </div>
  
  <div class="control-group">
    <label>3. Ritverktyg</label>
    <small style="color:#aaa; display:block; margin-bottom:10px;">Välj vilken yta du vill rita ovan, och rita sedan ut polygonen på kartan.</small>
    <button onclick="clearCurrentHoleData()" style="background:#ef4444; color:white;">Rensa Alla Min Karta för detta Hål</button>
  </div>
  
  <div class="control-group" style="background:#111; border: 1px solid #4ade80;">
    <label style="color:#4ade80;">4. Exportera Data</label>
    <button onclick="exportData()" style="background:#22c55e;">Generera Uppdaterad Ban-Fil</button>
    <textarea id="json-output" readonly placeholder="Resultatet från editorn kommer hamna här när du klickar på Export."></textarea>
  </div>
</div>

<!-- Load base data -->
<script src="data/valderrama.js"></script>

<script>
const API_KEY = "AIzaSyAX0hFTbQ5utdLQIM4gyXnqZElEMJTM3DU";
let map;
let drawingManager;
let currentHoleIndex = 0;
let currentType = 'FAIRWAY';

// Vi skapar en customMod variabel inuti HOLES!
// Vårt data-träd: HOLES[i].hazards = [ { type: 'SAND', path: [{lat,lng}, {lat,lng}...], height: null }, ... ]

// Fyll i Hål-rullgardinen
const select = document.getElementById('hole-select');
HOLES.forEach((h, i) => {
    let opt = document.createElement('option');
    opt.value = i;
    opt.innerText = `Hål ${i+1} (Par ${h.par})`;
    select.appendChild(opt);
});
select.addEventListener('change', (e) => {
    currentHoleIndex = parseInt(e.target.value);
    loadHole(currentHoleIndex);
});

let drawnOverlays = []; // Tillfälliga google.maps.Polygon objekt för nuvarande hål

function setType(type) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.type-btn.${type.toLowerCase()}`).classList.add('active');
    
    document.getElementById('tree-options').style.display = (type === 'TREE') ? 'block' : 'none';
    
    // Update drawing manager style
    if(drawingManager) {
        drawingManager.setOptions({
            polygonOptions: getPolygonOptsForType(type)
        });
    }
}

function getPolygonOptsForType(type) {
    let color = '#ffffff';
    if(type === 'GREEN') color = '#bef264';
    if(type === 'FAIRWAY') color = '#4ade80';
    if(type === 'ROUGH') color = '#166534';
    if(type === 'SAND') color = '#fcd34d';
    if(type === 'WATER') color = '#3b82f6';
    if(type === 'TREE') color = '#a21caf';
    if(type === 'OB') color = '#ef4444';
    if(type === 'TEE') color = '#60a5fa';
    if(type === 'WASTE') color = '#d97706';
    
    return {
        fillColor: color,
        fillOpacity: 0.5,
        strokeWeight: 2,
        strokeColor: color,
        editable: true,
        zIndex: 1
    };
}

function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
        zoom: 18,
        center: HOLES[0].tee, // Start at hole 1
        mapTypeId: 'satellite',
        tilt: 0
    });

    drawingManager = new google.maps.drawing.DrawingManager({
        drawingMode: google.maps.drawing.OverlayType.POLYGON,
        drawingControl: true,
        drawingControlOptions: {
            position: google.maps.ControlPosition.TOP_CENTER,
            drawingModes: ['polygon', 'polyline']
        },
        polygonOptions: getPolygonOptsForType(currentType)
    });
    drawingManager.setMap(map);

    // När användaren ritat klart en polygon
    google.maps.event.addListener(drawingManager, 'polygoncomplete', function (polygon) {
        // Vi sparar ner den till vår egna databas för nuvarande hål!
        if(!HOLES[currentHoleIndex].hazards) {
            HOLES[currentHoleIndex].hazards = [];
        }
        
        let pathArr = polygon.getPath().getArray().map(p => ({ lat: p.lat(), lng: p.lng() }));
        
        let hazardDef = {
            type: currentType,
            path: pathArr
        };
        
        if (currentType === 'TREE') {
            hazardDef.height = parseFloat(document.getElementById('tree-height').value);
        }
        
        // Push to internal state
        HOLES[currentHoleIndex].hazards.push(hazardDef);
        
        // Link the Google Maps object to the JS definition (so we can delete/edit it)
        polygon._hazardDef = hazardDef;
        drawnOverlays.push(polygon);
        
        // Switch back to hand-tool
        drawingManager.setDrawingMode(null);
    });

    // Sätt default knapp
    setType('FAIRWAY');
    loadHole(0);
}

function loadHole(idx) {
    if(!map || !HOLES[idx]) return;
    let hole = HOLES[idx];
    map.setCenter(hole.tee);
    map.setZoom(18);
    
    // Ta bort tidigare
    drawnOverlays.forEach(p => p.setMap(null));
    drawnOverlays = [];
    
    // Rita upp redan existerande Data från original valderrama.js (i vitt)
    // T.ex. HOLES[idx].bunkers är array av array med latlng
    if(hole.bunkers) {
        hole.bunkers.forEach(bPath => {
            let p = new google.maps.Polygon({
                paths: bPath,
                fillColor: '#fff',
                fillOpacity: 0.2,
                strokeWeight: 1,
                map: map
            });
            drawnOverlays.push(p);
        });
    }
    
    // Rita upp Nya redigeringar!
    if(hole.hazards) {
        hole.hazards.forEach(hz => {
            let p = new google.maps.Polygon(getPolygonOptsForType(hz.type));
            p.setPaths(hz.path);
            p.setMap(map);
            p._hazardDef = hz; // länk
            drawnOverlays.push(p);
        })
    }
}

function clearCurrentHoleData() {
    if(confirm('Vill du rensa dina nya ritningar för detta hål? (Påverkar inte original bunkers)')) {
        HOLES[currentHoleIndex].hazards = [];
        loadHole(currentHoleIndex);
    }
}

function exportData() {
    // Vi skapar en kopia av datan så vi inte pajar originalet just nu!
    document.getElementById('json-output').value = "const HOLES = " + JSON.stringify(HOLES, null, 2) + ";";
    alert('Kopiera datan från rutan och skriv över i data/valderrama.js!');
}

function initScript() {
    var script = document.createElement('script');
    script.src = 'https://maps.googleapis.com/maps/api/js?key=' + API_KEY + '&v=weekly&libraries=drawing&callback=initMap';
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);
}
initScript();

</script>
</body>
</html>
