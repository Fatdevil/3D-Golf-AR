<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf OS - Asset Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #canvas-container { flex: 1; position: relative; }
        #library-sidebar { width: 300px; background-color: #1e293b; padding: 20px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #334155; }
        #sidebar { width: 400px; background-color: #1e293b; padding: 20px; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; border-left: 1px solid #334155; }
        h1 { margin: 0 0 10px 0; font-size: 20px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        input, select, button { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 4px; font-family: inherit; font-size: 14px; }
        input[type="range"] { padding: 0; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; padding: 12px; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        #log { font-size: 12px; padding: 10px; background: #000; border-radius: 4px; min-height: 20px; color: #4ade80; }
        
        /* Library Styles */
        .lib-item { background: #0f172a; padding: 10px; border-radius: 6px; cursor: pointer; border: 1px solid #334155; display: flex; align-items: center; gap: 10px; transition: border-color 0.2s; }
        .lib-item:hover { border-color: #38bdf8; }
        .lib-item .icon { font-size: 20px; }
        .lib-item .details { display: flex; flex-direction: column; }
        .lib-item .name { font-weight: bold; font-size: 13px; color: #f8fafc; }
        .lib-item .subcat { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        
        #btn-delete { background: #ef4444; color: white; display: none; margin-top:0; }
        #btn-delete:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div id="library-sidebar">
        <h1>Cloud Library</h1>
        <div id="library-list" style="display:flex; flex-direction:column; gap:8px;">
            <div style="color:#94a3b8; font-size:12px;">Loading assets...</div>
        </div>
    </div>

    <div id="canvas-container">
        <!-- Overlay HUD -->
        <div style="position:absolute; top:10px; left:10px; background:rgba(0,0,0,0.5); padding:10px; border-radius:6px; pointer-events:none; z-index:10;">
            <div>Grid = 1x1 Meter</div>
            <div>Red Wireframe = Hitbox</div>
        </div>
        <button onclick="resetCamera()" style="position:absolute; top:70px; left:10px; padding:6px 12px; background:#475569; border-radius:4px; border:none; color:white; cursor:pointer; z-index:10;">Reset Camera</button>
    </div>

    <div id="sidebar">
        <h1>Asset Importer</h1>
        
        <div class="form-group">
            <label>GLB File</label>
            <input type="file" id="file-input" accept=".glb">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Asset ID</label>
                <input type="text" id="asset-id" placeholder="Ex: PINE_TALL">
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="asset-name" placeholder="Ex: Tall Pine">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Subcategory</label>
                <select id="asset-subcat">
                    <option value="TREES">Trees</option>
                    <option value="ROCKS">Rocks</option>
                    <option value="PLANTS">Plants</option>
                </select>
            </div>
            <div class="form-group" style="align-items:flex-start;">
                <label>Thumbnail</label>
                <div style="display:flex; gap:10px; align-items:center;">
                    <img id="thumb-preview" src="" alt="None" style="width:40px; height:40px; border-radius:4px; border:1px solid #475569; object-fit:cover; background:#000;">
                    <button id="btn-snap" onclick="snapThumbnail()" style="margin:0; padding:6px 10px; font-size:12px; border-radius:4px;">📸 CAPTURE</button>
                </div>
            </div>
        </div>

        <h1 style="margin-top: 15px; font-size: 14px;">Biomes (Miljöer)</h1>
        <div class="form-group" style="flex-direction:row; flex-wrap:wrap; gap:10px;">
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; text-transform:none; cursor:pointer;"><input type="checkbox" class="biome-cb" value="GLOBAL" checked> Global</label>
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; text-transform:none; cursor:pointer;"><input type="checkbox" class="biome-cb" value="DESERT"> Desert</label>
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; text-transform:none; cursor:pointer;"><input type="checkbox" class="biome-cb" value="SNOW"> Snow</label>
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; text-transform:none; cursor:pointer;"><input type="checkbox" class="biome-cb" value="MOON"> Moon</label>
            <label style="display:flex; align-items:center; gap:4px; font-size:12px; text-transform:none; cursor:pointer;"><input type="checkbox" class="biome-cb" value="AUTUMN"> Autumn</label>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Target Height (m) <span id="val-height">15.0</span></label>
                <input type="range" id="target-height" min="0.1" max="40" step="0.1" value="15.0">
            </div>
            <div class="form-group">
                <label>Y Offset (m) <span id="val-offset">0.0</span></label>
                <input type="range" id="y-offset" min="-5" max="5" step="0.1" value="0.0">
            </div>
        </div>
        
        <div class="form-group">
            <label>Brightness Boost <span id="val-brightness">0.1</span></label>
            <input type="range" id="brightness" min="-0.5" max="1.0" step="0.05" value="0.1">
        </div>

        <h1 style="margin-top: 20px; font-size: 16px; display:flex; justify-content:space-between; align-items:center;">
            Physics Hitbox
            <label style="font-size:10px; font-weight:normal; cursor:pointer; color:#cbd5e1; text-transform:none;">
                <input type="checkbox" id="toggle-hitbox" checked style="vertical-align:middle;"> Show Wireframe
            </label>
        </h1>
        <div class="form-group">
            <label>Collision Shape</label>
            <select id="physics-type">
                <option value="tree">Tree (Trunk + Canopy)</option>
                <option value="sphere">Sphere (Rock/Bush)</option>
                <option value="cylinder">Cylinder (Cactus/Pole)</option>
            </select>
        </div>

        <!-- Dynamic Physics Controls -->
        <div id="phys-tree-ctrl" class="row">
            <div class="form-group">
                <label>Trunk Rad <span id="val-trunk">0.5</span></label>
                <input type="range" id="tree-trunk" min="0.1" max="5" step="0.1" value="0.5">
            </div>
            <div class="form-group">
                <label>Canopy Rad <span id="val-canopy">3.5</span></label>
                <input type="range" id="tree-canopy" min="0.5" max="15" step="0.5" value="3.5">
            </div>
        </div>

        <div id="phys-sphere-ctrl" class="form-group" style="display:none;">
            <label>Radius (m) <span id="val-radius">2.0</span></label>
            <input type="range" id="sphere-radius" min="0.5" max="15" step="0.1" value="2.0">
        </div>

        <div class="form-group" style="margin-top:20px;">
            <label>Admin Password</label>
            <input type="password" id="admin-pass" placeholder="Enter password">
        </div>

        <div class="row" style="margin-top:10px;">
            <button id="btn-save" style="margin-top:0;">PUBLISH TO CLOUD</button>
            <button id="btn-delete">DELETE FROM CLOUD</button>
        </div>
        <div id="log">Awaiting file...</div>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#334155');

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 10, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 5, 0);
        controls.minDistance = 2;
        controls.maxDistance = 150;
        
        window.resetCamera = function() {
            camera.position.set(0, 10, 30);
            controls.target.set(0, 5, 0);
            controls.update();
        };

        // Ljus
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Mark
        const grid = new THREE.GridHelper(50, 50, 0x475569, 0x475569);
        scene.add(grid);

        // Grupper
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);
        const hitboxGroup = new THREE.Group();
        scene.add(hitboxGroup);

        let currentModel = null;
        let base64Data = null;
        let thumbnailBase64 = null;

        // --- PREVIEW LOGIC ---
        function updateHitbox() {
            // Rensa gamla hitboxen
            while(hitboxGroup.children.length > 0) {
                hitboxGroup.remove(hitboxGroup.children[0]);
            }

            const pType = document.getElementById('physics-type').value;
            const tHeight = parseFloat(document.getElementById('target-height').value);
            const yOff = parseFloat(document.getElementById('y-offset').value);

            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, transparent: true, opacity: 0.5 });

            if (pType === 'tree') {
                const trunkR = parseFloat(document.getElementById('tree-trunk').value);
                const canR = parseFloat(document.getElementById('tree-canopy').value);
                
                // Stam (Cylinder) - går från marken upp till kronan
                const trunkGeo = new THREE.CylinderGeometry(trunkR, trunkR, tHeight, 16);
                const trunkMesh = new THREE.Mesh(trunkGeo, mat);
                trunkMesh.position.y = tHeight / 2 + yOff;
                hitboxGroup.add(trunkMesh);

                // Krona (Sfär) - i toppen av trädet
                const canGeo = new THREE.SphereGeometry(canR, 16, 16);
                const canMesh = new THREE.Mesh(canGeo, mat);
                canMesh.position.y = tHeight + yOff - (canR * 0.5); // Något ner från absolut topp
                hitboxGroup.add(canMesh);
            } 
            else if (pType === 'sphere') {
                const r = parseFloat(document.getElementById('sphere-radius').value);
                const geo = new THREE.SphereGeometry(r, 16, 16);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = r + yOff; // Centrerad ovanför mark baserat på radien
                hitboxGroup.add(mesh);
            }
            else if (pType === 'cylinder') {
                const r = parseFloat(document.getElementById('sphere-radius').value); // Återanvänder radius-slidern
                const geo = new THREE.CylinderGeometry(r, r, tHeight, 16);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.y = tHeight / 2 + yOff;
                hitboxGroup.add(mesh);
            }
        }

        function updateModelScale() {
            if (!currentModel) return;
            const tHeight = parseFloat(document.getElementById('target-height').value);
            const yOff = parseFloat(document.getElementById('y-offset').value);
            const bright = parseFloat(document.getElementById('brightness').value);

            // Skala baserat på originalhöjd
            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            
            // Om vi redan skalat om modellen tidigare, måste vi räkna mot dess original bbox. 
            // För enkelhetens skull låter vi loader:n skala till 1m, sedan multiplicerar vi med tHeight.
            currentModel.scale.setScalar(tHeight);
            currentModel.position.y = yOff;

            // Justera brightness
            currentModel.traverse((child) => {
                if (child.isMesh && child.material) {
                    if (!child.userData.origEmissive) {
                        child.userData.origEmissive = child.material.emissive ? child.material.emissive.clone() : new THREE.Color(0,0,0);
                    }
                    if (bright > 0) {
                        child.material.emissive.setHex(0xffffff);
                        child.material.emissiveIntensity = bright;
                    } else {
                        child.material.emissive.copy(child.userData.origEmissive);
                        child.material.emissiveIntensity = 0;
                    }
                }
            });

            updateHitbox();
        }

        function snapThumbnail() {
            // Hide helpers for clean shot
            grid.visible = false;
            hitboxGroup.visible = false;
            
            // Force a render so it's clean
            renderer.render(scene, camera);
            
            // Capture canvas
            const dataUrl = renderer.domElement.toDataURL('image/png');
            thumbnailBase64 = dataUrl;
            document.getElementById('thumb-preview').src = dataUrl;
            
            // Restore helpers
            grid.visible = true;
            hitboxGroup.visible = document.getElementById('toggle-hitbox').checked;
        }

        // --- EVENT LISTENERS ---
        let fileSizeMB = 0;

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Autogenerera namn
            const baseName = file.name.split('.')[0];
            document.getElementById('asset-id').value = baseName.toUpperCase().replace(/[^A-Z0-9]/g, '_');
            document.getElementById('asset-name').value = baseName;

            // Spara MB storlek
            fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
            document.getElementById('log').innerText = `Vald fil: ${baseName} (${fileSizeMB} MB)`;

            const reader = new FileReader();
            reader.onload = function(event) {
                base64Data = event.target.result;
                loadModelFromBase64(base64Data);
            };
            reader.readAsDataURL(file);
        });

        function loadModelFromBase64(b64) {
            const loader = new THREE.GLTFLoader();
            loader.load(b64, function(gltf) {
                // Rensa gamla
                while(modelGroup.children.length > 0) {
                    modelGroup.remove(modelGroup.children[0]);
                }

                currentModel = gltf.scene;
                
                // Normalisera storlek till 1 meter hög
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3());
                const normalizeScale = 1.0 / size.y;
                
                // Centrera och lägg botten på marken
                const center = box.getCenter(new THREE.Vector3());
                const cymin = isFinite(box.min.y) ? box.min.y : 0;
                
                currentModel.scale.setScalar(normalizeScale);
                currentModel.position.x = -center.x * normalizeScale;
                currentModel.position.y = -cymin * normalizeScale;
                currentModel.position.z = -center.z * normalizeScale;

                // Lägg i en container för att hålla 1m referensen i botten
                const containerMesh = new THREE.Group();
                containerMesh.add(currentModel);
                currentModel = containerMesh;

                modelGroup.add(currentModel);
                updateModelScale();
                document.getElementById('log').innerText = "Model loaded successfully.";
            });
        }
        
        // --- CLOUD LIBRARY LOGIC ---
        async function fetchLibrary() {
            try {
                const res = await fetch('/api/assets');
                const assets = await res.json();
                const list = document.getElementById('library-list');
                list.innerHTML = '';
                
                if (assets.length === 0) {
                    list.innerHTML = '<div style="color:#94a3b8; font-size:12px;">No custom assets found.</div>';
                    return;
                }
                
                assets.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'lib-item';
                    const thumbHtml = (a.config && a.config.thumbnail) 
                        ? `<img src="${a.config.thumbnail}" style="width:30px; height:30px; object-fit:cover; border-radius:4px;">` 
                        : `<div class="icon">📦</div>`;
                    
                    div.innerHTML = `
                        ${thumbHtml}
                        <div class="details">
                            <span class="name">${a.name}</span>
                            <span class="subcat">${a.subcategory || a.category}</span>
                        </div>
                    `;
                    div.onclick = () => loadAssetFromLibrary(a);
                    list.appendChild(div);
                });
            } catch(e) {
                console.error(e);
            }
        }
        
        async function loadAssetFromLibrary(assetInfo) {
            document.getElementById('log').innerText = "Downloading " + assetInfo.id + "...";
            try {
                // Populate Form
                document.getElementById('asset-id').value = assetInfo.id;
                document.getElementById('asset-name').value = assetInfo.name;
                document.getElementById('asset-subcat').value = assetInfo.subcategory || 'TREES';
                
                // Populate Config if exists
                if (assetInfo.config) {
                    if (assetInfo.config.thumbnail) {
                        thumbnailBase64 = assetInfo.config.thumbnail;
                        document.getElementById('thumb-preview').src = thumbnailBase64;
                    } else {
                        thumbnailBase64 = null;
                        document.getElementById('thumb-preview').src = '';
                    }
                    if (assetInfo.config.targetHeight) document.getElementById('target-height').value = assetInfo.config.targetHeight;
                    if (assetInfo.config.yOffset) document.getElementById('y-offset').value = assetInfo.config.yOffset;
                    if (assetInfo.config.brightness !== undefined) document.getElementById('brightness').value = assetInfo.config.brightness;
                    
                    if (assetInfo.config.physics) {
                        const physType = assetInfo.config.physics.type || 'tree';
                        document.getElementById('physics-type').value = physType;
                        document.getElementById('physics-type').dispatchEvent(new Event('change'));
                        
                        if (physType === 'tree') {
                            if (assetInfo.config.physics.trunkRadius) document.getElementById('tree-trunk').value = assetInfo.config.physics.trunkRadius;
                            if (assetInfo.config.physics.canopyRadius) document.getElementById('tree-canopy').value = assetInfo.config.physics.canopyRadius;
                        } else {
                            if (assetInfo.config.physics.radius) document.getElementById('sphere-radius').value = assetInfo.config.physics.radius;
                        }
                    }
                    
                    // Checkboxes (Biomes)
                    document.querySelectorAll('.biome-cb').forEach(cb => {
                        cb.checked = assetInfo.config.biomes && assetInfo.config.biomes.includes(cb.value);
                    });
                }
                
                // Show Delete button
                document.getElementById('btn-delete').style.display = 'block';
                
                // Update Value Labels
                ['target-height', 'y-offset', 'brightness', 'tree-trunk', 'tree-canopy', 'sphere-radius'].forEach(id => {
                    document.getElementById(id).dispatchEvent(new Event('input'));
                });

                // Fetch Base64 data
                const res = await fetch('/api/assets/' + assetInfo.id + '/download');
                const data = await res.json();
                
                if (data.file_data) {
                    base64Data = data.file_data;
                    loadModelFromBase64(base64Data);
                    document.getElementById('log').innerText = "Loaded from Cloud: " + assetInfo.name;
                } else {
                    document.getElementById('log').innerText = "❌ Missing 3D data";
                }
            } catch(e) {
                console.error(e);
                document.getElementById('log').innerText = "❌ Failed to load asset";
            }
        }
        
        // Load library on start
        fetchLibrary();

        // Koppla sliders till uppdatering
        ['target-height', 'y-offset', 'brightness', 'tree-trunk', 'tree-canopy', 'sphere-radius'].forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                let suffix = id;
                if(id.includes('-')) {
                    suffix = id.split('-')[1];
                }
                const valId = 'val-' + suffix;
                if (document.getElementById(valId)) {
                    document.getElementById(valId).innerText = parseFloat(e.target.value).toFixed(2);
                }
                updateModelScale();
            });
        });

        document.getElementById('physics-type').addEventListener('change', function(e) {
            const t = e.target.value;
            document.getElementById('phys-tree-ctrl').style.display = t === 'tree' ? 'flex' : 'none';
            document.getElementById('phys-sphere-ctrl').style.display = (t === 'sphere' || t === 'cylinder') ? 'flex' : 'none';
            updateHitbox();
        });

        // Automatisk ifyllnad: Ändrar du kategori till Rock, så ställs fysiken om till Sphere
        document.getElementById('asset-subcat').addEventListener('change', function(e) {
            const val = e.target.value;
            const physSelect = document.getElementById('physics-type');
            if (val === 'TREES') physSelect.value = 'tree';
            else if (val === 'ROCKS') physSelect.value = 'sphere';
            else if (val === 'PLANTS') physSelect.value = 'sphere';
            physSelect.dispatchEvent(new Event('change'));
        });

        // Dölj/Visa Hitbox
        document.getElementById('toggle-hitbox').addEventListener('change', function(e) {
            hitboxGroup.visible = e.target.checked;
        });

        // --- SPARA TILL BACKEND ---
        document.getElementById('btn-save').addEventListener('click', async () => {
            if (!base64Data) return alert("Please load a .glb file first!");
            const pass = document.getElementById('admin-pass').value;
            if (!pass) return alert("Password required");

            const id = document.getElementById('asset-id').value;
            const name = document.getElementById('asset-name').value;
            const subcat = document.getElementById('asset-subcat').value;
            
            const pType = document.getElementById('physics-type').value;
            let physicsConf = { type: pType };
            if (pType === 'tree') {
                physicsConf.trunkRadius = parseFloat(document.getElementById('tree-trunk').value);
                physicsConf.height = parseFloat(document.getElementById('target-height').value);
                physicsConf.canopyRadius = parseFloat(document.getElementById('tree-canopy').value);
            } else if (pType === 'sphere') {
                physicsConf.radius = parseFloat(document.getElementById('sphere-radius').value);
            } else if (pType === 'cylinder') {
                physicsConf.radius = parseFloat(document.getElementById('sphere-radius').value);
                physicsConf.height = parseFloat(document.getElementById('target-height').value);
            }

            const config = {
                targetHeight: parseFloat(document.getElementById('target-height').value),
                yOffset: parseFloat(document.getElementById('y-offset').value),
                brightness: parseFloat(document.getElementById('brightness').value),
                cat: 'nature',
                subcat: subcat,
                thumbnail: thumbnailBase64,
                physics: physicsConf,
                biomes: Array.from(document.querySelectorAll('.biome-cb:checked')).map(cb => cb.value),
                fileSizeMB: parseFloat(fileSizeMB)
            };

            document.getElementById('log').innerText = "Uploading to Cloud...";

            try {
                const res = await fetch('/api/assets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id, name, category: 'nature', subcategory: subcat, icon: '', file_data: base64Data, config, password: pass
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById('log').innerText = "✅ Successfully Published: " + id;
                    document.getElementById('btn-delete').style.display = 'block'; // Show delete now that it exists
                    fetchLibrary(); // Refresh library
                } else {
                    document.getElementById('log').innerText = "❌ Error: " + data.error;
                }
            } catch(e) {
                document.getElementById('log').innerText = "❌ Exception: " + e.message;
            }
        });
        
        // --- DELETE FRÅN BACKEND ---
        document.getElementById('btn-delete').addEventListener('click', async () => {
            const pass = document.getElementById('admin-pass').value;
            if (!pass) return alert("Password required to delete");
            const id = document.getElementById('asset-id').value;
            
            if (!confirm("Are you sure you want to permanently delete '" + id + "' from the Cloud? This will break any courses using it.")) return;
            
            document.getElementById('log').innerText = "Deleting...";
            try {
                const res = await fetch('/api/assets/' + id, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                
                const data = await res.json();
                if (data.success) {
                    document.getElementById('log').innerText = "✅ Successfully Deleted: " + id;
                    document.getElementById('btn-delete').style.display = 'none';
                    // Clear 3D view
                    while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
                    base64Data = null;
                    fetchLibrary(); // Refresh library
                } else {
                    document.getElementById('log').innerText = "❌ Error: " + data.error;
                }
            } catch(e) {
                document.getElementById('log').innerText = "❌ Exception: " + e.message;
            }
        });

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
