# The tests of tests/README.md, run on every pull request.
#   unit     every tests/test_*.js (npm test): physics, rules, handicap, collections, the static checks
#   api      collections-e2e: the real server.js against a real Postgres, over HTTP, no browser
#   browser  the three browser tests in headless Chromium: the smoke test, the shape smoke test (phone and desktop) and the courses e2e (also Postgres)
#
# Actions minutes: unit and api take about a minute each, the browser tests about 40 together. So:
#   - unit and api run on every pull request (and every push to it)
#   - the browser tests run only when the pull request has the label "browser-tests" (adding the label starts them), or by hand
#     (Actions > CI > Run workflow, which runs everything on the chosen branch)
#   - nothing runs on the push to main after a merge (the pull request was already tested), nor for a change to docs only
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# a new push cancels the run of the previous one; adding the label runs in a group of its own, so it does not cancel the unit/api run
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  api:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/golf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node tests/e2e/collections-e2e.js
      - run: node tests/e2e/ratings-e2e.js
      - run: node tests/e2e/approach-e2e.js

  browser:
    # by hand, or a pull request with the label "browser-tests" (pushed to, or the label just added; another label added does nothing)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'browser-tests') &&
       (github.event.action != 'labeled' || github.event.label.name == 'browser-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            command: node tests/smoke/arcade-smoke.js
          - name: shape
            command: node tests/smoke/shot-shape-smoke.js
          - name: courses-e2e
            command: node tests/e2e/courses-e2e.js
    name: browser (${{ matrix.name }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: golf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/golf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm --prefix tests install --no-audit --no-fund
      - run: npx --prefix tests playwright-core install --with-deps chromium
      - run: ${{ matrix.command }}
