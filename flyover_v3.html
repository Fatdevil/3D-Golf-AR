<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenRead AR — 3D Flyover</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0f1a;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
#container{width:100vw;height:100vh;position:relative}
canvas{display:block}

/* Premium HUD */
.hud-bar{position:absolute;top:0;left:0;right:0;height:52px;
  background:linear-gradient(180deg,rgba(8,12,21,0.92) 0%,rgba(8,12,21,0.3) 100%);
  backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;z-index:10;border-bottom:1px solid rgba(255,255,255,0.06)}
.hud-left{display:flex;flex-direction:column;gap:1px}
.hud-hole{font-size:18px;font-weight:700;letter-spacing:-0.4px}
.hud-course{font-size:11px;color:rgba(255,255,255,0.4);font-weight:400;letter-spacing:0.3px}
.hud-right{display:flex;align-items:center;gap:18px}
.hud-par{font-size:12px;color:#22c55e;font-weight:600;letter-spacing:1.5px}
.hud-dist{font-size:24px;font-weight:700;letter-spacing:-0.8px}

.progress-track{position:absolute;top:52px;left:0;right:0;height:2px;background:rgba(255,255,255,0.04);z-index:10}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#3b82f6);transition:width 0.15s linear}

/* Telemetry */
.telemetry{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
  display:flex;gap:24px;z-index:10;opacity:0;transition:opacity 0.5s}
.telemetry.visible{opacity:1}
.tele-item{display:flex;align-items:baseline;gap:4px;font-size:11px;
  color:rgba(255,255,255,0.3);letter-spacing:0.8px;text-transform:uppercase}
.tele-item .val{font-size:16px;font-weight:700;color:rgba(255,255,255,0.75);letter-spacing:-0.5px}

/* Button */
.cta-wrap{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10}
#btn-fly{border:none;padding:12px 40px;border-radius:50px;font-size:14px;font-weight:600;
  color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;letter-spacing:0.3px;
  background:linear-gradient(135deg,#10B981,#059669);
  box-shadow:0 6px 24px rgba(16,185,129,0.35);transition:all 0.3s}
#btn-fly:hover{transform:scale(1.03);box-shadow:0 10px 36px rgba(16,185,129,0.4)}

/* Data badge */
.data-badge{position:absolute;top:60px;right:16px;background:rgba(8,12,21,0.7);
  backdrop-filter:blur(8px);border-radius:10px;padding:8px 14px;z-index:10;
  font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.5px;
  border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;gap:2px}
.data-badge .big{font-size:16px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:-0.3px}

/* Loading */
#loading{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#0a0f1a;z-index:100;transition:opacity 0.6s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border:2.5px solid rgba(255,255,255,0.08);
  border-top-color:#22c55e;border-radius:50%;animation:spin 0.7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:rgba(255,255,255,0.4);letter-spacing:0.3px}
.loading-sub{font-size:11px;color:rgba(255,255,255,0.2);margin-top:4px}
</style>
</head>
<body>
<div id="container">
  <div class="hud-bar">
    <div class="hud-left">
      <div class="hud-hole">Hål 1</div>
      <div class="hud-course">Norrmjöle GK</div>
    </div>
    <div class="hud-right">
      <div class="hud-par">PAR 4</div>
      <div class="hud-dist" id="hud-dist">345m</div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

  <div class="data-badge">
    <span>LANTMÄTERIET LiDAR</span>
    <span class="big" id="point-badge">—</span>
    <span>laserpunkter</span>
  </div>

  <div class="telemetry" id="telemetry">
    <div class="tele-item">ALT <span class="val" id="alt-val">0</span>m</div>
    <div class="tele-item">SPD <span class="val" id="spd-val">0</span>km/h</div>
  </div>

  <div class="cta-wrap">
    <button id="btn-fly">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
      Starta Drönarflygning
    </button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Laddar Lantmäteriet LiDAR...</div>
    <div class="loading-sub">300 000 laserpunkter</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================
   GreenRead AR — Premium LiDAR Flyover v3
   Raw point cloud + cinematic rendering
   ============================================ */

let scene, camera, renderer;
let pointCloud, terrainMesh;
let cloudData, terrainGrid, terrainMeta;
let isFlying = false, flyStart = 0, flyProgress = 0;
const FLIGHT_DURATION = 20;
const cameraPath = [];
let TEE, GREEN;

init();

async function init() {
    const container = document.getElementById('container');

    // ======== SCENE ========
    scene = new THREE.Scene();

    // Premium sky gradient
    const skyC = document.createElement('canvas');
    skyC.width = 2; skyC.height = 512;
    const ctx = skyC.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.0, '#0a1628');
    g.addColorStop(0.15, '#152847');
    g.addColorStop(0.35, '#2a5078');
    g.addColorStop(0.5, '#4a82aa');
    g.addColorStop(0.65, '#7ab0cc');
    g.addColorStop(0.78, '#b8d4dd');
    g.addColorStop(0.88, '#ddd0b8');
    g.addColorStop(0.95, '#d4a868');
    g.addColorStop(1.0, '#c48040');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 2, 512);
    scene.background = new THREE.CanvasTexture(skyC);

    // Atmospheric fog
    scene.fog = new THREE.FogExp2(0x6a8eaa, 0.0018);

    // ======== CAMERA ========
    camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.5, 2500);

    // ======== RENDERER ========
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ======== LIGHTING — Nordic golden hour ========
    scene.add(new THREE.AmbientLight(0x8aadcc, 0.4));

    const sun = new THREE.DirectionalLight(0xffecd0, 1.2);
    sun.position.set(-180, 100, -120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -300; sun.shadow.camera.right = 300;
    sun.shadow.camera.top = 300; sun.shadow.camera.bottom = -300;
    sun.shadow.camera.far = 600;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x88bbee, 0.2);
    fill.position.set(100, 200, 50);
    scene.add(fill);

    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x1a3a18, 0.25));

    // ======== LOAD DATA ========
    try {
        // Load both: point cloud for trees + terrain mesh data for ground
        const [pcResp, holeResp] = await Promise.all([
            fetch('data/pointcloud_hole1.json'),
            fetch('data/hole1_v2.json')
        ]);
        cloudData = await pcResp.json();
        const holeData = await holeResp.json();

        terrainGrid = holeData.points;
        terrainMeta = holeData.metadata;
        TEE = holeData.metadata.tee_3d;
        GREEN = holeData.metadata.green_3d;

        document.getElementById('point-badge').textContent = cloudData.count.toLocaleString();

        // Build world
        buildTerrainMesh();
        buildPointCloud();
        // buildFairwayStrip(); — removed, terrain vertex colors handle fairway
        // Green/tee/bunker shapes removed — satellite shows the real ones
        // Only keep the flag pin as a 3D landmark
        buildFlagPin();
        buildDistanceMarkers();
        setupCameraPath();

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            // Auto-start after brief pause
            setTimeout(startFlight, 800);
        }, 400);

    } catch (e) {
        console.error('Load failed:', e);
        document.querySelector('.loading-text').textContent = 'Kunde inte ladda data';
    }

    window.addEventListener('resize', onResize);
    document.getElementById('btn-fly').addEventListener('click', startFlight);
    animate();
}

// ============================================
// SOLID TERRAIN MESH — Satellite textured
// ============================================
function buildTerrainMesh() {
    if (!terrainMeta) return;
    const w = terrainMeta.width, d = terrainMeta.depth, res = terrainMeta.resolution;

    // Build terrain manually in world coords: x=East, y=Up, z=North
    // This matches the point cloud coordinate system
    const geom = new THREE.BufferGeometry();
    const vertices = new Float32Array(res * res * 3);
    const uvs = new Float32Array(res * res * 2);
    const indices = [];

    for (let iz = 0; iz < res; iz++) {
        for (let ix = 0; ix < res; ix++) {
            const idx = iz * res + ix;
            // World position: x=East offset, z=North offset
            const worldX = (ix / (res - 1) - 0.5) * w;  // -w/2 to +w/2 (West to East)
            const worldZ = (iz / (res - 1) - 0.5) * d;  // -d/2 to +d/2 (South to North)
            const h = (terrainGrid[iz] && terrainGrid[iz][ix]) || 3;

            vertices[idx * 3] = worldX;      // x = East
            vertices[idx * 3 + 1] = h;        // y = elevation
            vertices[idx * 3 + 2] = worldZ;   // z = North

            // UV mapping: satellite image row 0 = North, row max = South
            // THREE.js texture.flipY=true by default, which flips the image on load
            // After flipY: texture v=0 = bottom of original (South), v=1 = top (North)
            // iz=0 (south) → v=0, iz=max (north) → v=1 ✓
            // ix=0 (west) → u should map to LEFT of image = u=0 
            // But we need to flip U since the image shows east on the right
            uvs[idx * 2] = 1.0 - ix / (res - 1);  // flip east-west
            uvs[idx * 2 + 1] = iz / (res - 1);     // south→0, north→1
        }
    }

    // Build triangle indices
    for (let iz = 0; iz < res - 1; iz++) {
        for (let ix = 0; ix < res - 1; ix++) {
            const a = iz * res + ix;
            const b = a + 1;
            const c = a + res;
            const dd = c + 1;
            indices.push(a, c, b);
            indices.push(b, c, dd);
        }
    }

    geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geom.setIndex(indices);
    geom.computeVertexNormals();

    // Load satellite texture
    const satTex = new THREE.TextureLoader().load('data/satellite_hole1.jpg', (tex) => {
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        console.log('Satellite texture loaded');
    });

    terrainMesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        map: satTex,
        roughness: 0.9,
        metalness: 0,
    }));
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    // Extended terrain ring (dark green beyond satellite coverage)
    const extGeom = new THREE.PlaneGeometry(w * 2.5, d * 2.5, 20, 20);
    extGeom.rotateX(-Math.PI / 2);
    const extMesh = new THREE.Mesh(extGeom, new THREE.MeshStandardMaterial({
        color: 0x0a1a0a, roughness: 0.95
    }));
    extMesh.position.y = -0.3;
    extMesh.receiveShadow = true;
    scene.add(extMesh);
}

// ============================================
// LIDAR POINT CLOUD — Premium rendering
// ============================================
function buildPointCloud() {
    // Only render vegetation + water (skip ground — terrain mesh handles that)
    const vegIndices = [];
    for (let i = 0; i < cloudData.count; i++) {
        if (cloudData.cls[i] === 1 || cloudData.cls[i] === 9) vegIndices.push(i);
    }
    const count = vegIndices.length;
    console.log(`Rendering ${count} vegetation/water points from ${cloudData.count} total`);

    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const sizes = new Float32Array(count);

    for (let j = 0; j < count; j++) {
        const i = vegIndices[j];
        positions[j*3] = cloudData.x[i];
        positions[j*3+1] = cloudData.z[i];
        positions[j*3+2] = cloudData.y[i];

        const cls = cloudData.cls[i];
        const h = cloudData.z[i];

        if (cls === 1) {
            // Vegetation — rich greens, larger for taller canopy
            const t = Math.max(0, Math.min(1, h / 20));
            const v = 0.85 + Math.random() * 0.15;
            colors[j*3] = (0.03 + t * 0.08) * v;
            colors[j*3+1] = (0.15 + t * 0.55) * v;
            colors[j*3+2] = (0.02 + t * 0.06) * v;
            sizes[j] = 2.5 + t * 5.0;
        } else {
            // Water
            colors[j*3] = 0.1; colors[j*3+1] = 0.3; colors[j*3+2] = 0.65;
            sizes[j] = 2.0;
        }
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Circular soft point texture
    const ptCanvas = document.createElement('canvas');
    ptCanvas.width = 64; ptCanvas.height = 64;
    const ptCtx = ptCanvas.getContext('2d');
    const ptGrad = ptCtx.createRadialGradient(32,32,0, 32,32,32);
    ptGrad.addColorStop(0, 'rgba(255,255,255,1)');
    ptGrad.addColorStop(0.4, 'rgba(255,255,255,0.8)');
    ptGrad.addColorStop(0.7, 'rgba(255,255,255,0.3)');
    ptGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ptCtx.fillStyle = ptGrad;
    ptCtx.fillRect(0,0,64,64);
    const ptTex = new THREE.CanvasTexture(ptCanvas);

    const mat = new THREE.PointsMaterial({
        size: 3.5,
        vertexColors: true,
        map: ptTex,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
    });

    pointCloud = new THREE.Points(geom, mat);
    scene.add(pointCloud);
}

// ============================================
// FAIRWAY STRIP
// ============================================
function buildFairwayStrip() {
    const segments = 40;
    const shape = new THREE.Shape();
    const perpX = -(GREEN.z - TEE.z) / dist3d();
    const perpZ = (GREEN.x - TEE.x) / dist3d();

    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = TEE.x + (GREEN.x - TEE.x) * t;
        const z = TEE.z + (GREEN.z - TEE.z) * t;
        const halfW = fwWidth(t);
        if (i === 0) shape.moveTo(x + perpX*halfW, z + perpZ*halfW);
        else shape.lineTo(x + perpX*halfW, z + perpZ*halfW);
    }
    for (let i = segments; i >= 0; i--) {
        const t = i / segments;
        const x = TEE.x + (GREEN.x - TEE.x) * t;
        const z = TEE.z + (GREEN.z - TEE.z) * t;
        shape.lineTo(x - perpX*fwWidth(t), z - perpZ*fwWidth(t));
    }

    const geom = new THREE.ShapeGeometry(shape);
    geom.rotateX(-Math.PI/2);
    const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        color: 0x2a6e38, roughness: 0.85, transparent: true, opacity: 0.5, depthWrite: false
    }));
    mesh.position.y = 0.08;
    mesh.receiveShadow = true;
    scene.add(mesh);
}

// ============================================
// FLAG PIN — only 3D element on green
// ============================================
function buildFlagPin() {
    const gy = getH(GREEN.x, GREEN.z);
    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 3, 6),
        new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.4, roughness: 0.3 })
    );
    pole.position.set(GREEN.x + 1.5, gy + 1.8, GREEN.z - 1);
    pole.castShadow = true;
    scene.add(pole);

    const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(1.2, 0.6),
        new THREE.MeshStandardMaterial({ color: 0xe02020, side: THREE.DoubleSide })
    );
    flag.position.set(GREEN.x + 2.1, gy + 3.1, GREEN.z - 1);
    scene.add(flag);
}

function fwWidth(t) {
    if (t < 0.05) return 5 + t/0.05 * 10;
    if (t > 0.85) return 15 - (t-0.85)/0.15 * 8;
    return 15 + Math.sin(t*Math.PI) * 4;
}

function dist3d() { return Math.sqrt((GREEN.x-TEE.x)**2+(GREEN.z-TEE.z)**2); }
function distToFairway(x,z) {
    if (!TEE || !GREEN) return 100;
    const dx=GREEN.x-TEE.x, dz=GREEN.z-TEE.z, l2=dx*dx+dz*dz;
    const t=Math.max(0,Math.min(1,((x-TEE.x)*dx+(z-TEE.z)*dz)/l2));
    return Math.sqrt((x-TEE.x-t*dx)**2+(z-TEE.z-t*dz)**2);
}

// ============================================
// GREEN
// ============================================
function buildGreen() {
    const gy = getH(GREEN.x, GREEN.z);

    // Green surface
    const g1 = new THREE.CircleGeometry(14, 48);
    g1.rotateX(-Math.PI/2);
    const gMesh = new THREE.Mesh(g1, new THREE.MeshStandardMaterial({ color:0x3abd55, roughness:0.7 }));
    gMesh.position.set(GREEN.x, gy+0.15, GREEN.z);
    gMesh.receiveShadow = true;
    scene.add(gMesh);

    // Fringe
    const fr = new THREE.RingGeometry(14, 19, 48);
    fr.rotateX(-Math.PI/2);
    const frM = new THREE.Mesh(fr, new THREE.MeshStandardMaterial({ color: 0x2d8a3a, roughness: 0.85 }));
    frM.position.set(GREEN.x, gy+0.12, GREEN.z);
    scene.add(frM);

    // Flagpole + flag
    const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 2.8, 6),
        new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.4, roughness: 0.3 })
    );
    pole.position.set(GREEN.x+1.5, gy+1.6, GREEN.z-1);
    pole.castShadow = true;
    scene.add(pole);

    const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 0.5),
        new THREE.MeshStandardMaterial({ color: 0xe02020, side: THREE.DoubleSide })
    );
    flag.position.set(GREEN.x+2, gy+2.8, GREEN.z-1);
    scene.add(flag);

    // Bunkers
    [
        { dx:-11, dz:7, rx:7, rz:4 },
        { dx:9, dz:-4, rx:5, rz:6 },
    ].forEach(b => {
        const bx = GREEN.x+b.dx, bz = GREEN.z+b.dz;
        const bg = new THREE.EllipseCurve(0,0,b.rx,b.rz,0,Math.PI*2);
        const bShape = new THREE.Shape(bg.getPoints(24));
        const bGeom = new THREE.ShapeGeometry(bShape);
        bGeom.rotateX(-Math.PI/2);
        const bMesh = new THREE.Mesh(bGeom, new THREE.MeshStandardMaterial({ color:0xd4c090, roughness:0.95 }));
        bMesh.position.set(bx, getH(bx,bz)+0.08, bz);
        bMesh.receiveShadow = true;
        scene.add(bMesh);
    });
}

// ============================================
// TEE BOX
// ============================================
function buildTeeBox() {
    const ty = getH(TEE.x, TEE.z);
    const box = new THREE.Mesh(
        new THREE.BoxGeometry(7, 0.15, 10),
        new THREE.MeshStandardMaterial({ color: 0x3abd55, roughness: 0.8 })
    );
    box.position.set(TEE.x, ty+0.08, TEE.z);
    box.receiveShadow = true;
    scene.add(box);

    // Tee markers
    [-1.8, 1.8].forEach(ox => {
        const m = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0xffffff })
        );
        m.position.set(TEE.x+ox, ty+0.25, TEE.z+4);
        scene.add(m);
    });
}

// ============================================
// WATER
// ============================================
function buildWater(waterAreas) {
    if (!waterAreas || waterAreas.length === 0) return;
    waterAreas.forEach(w => {
        const wx = (w.min_x+w.max_x)/2, wz = (w.min_z+w.max_z)/2;
        const ww = Math.abs(w.max_x-w.min_x), wd = Math.abs(w.max_z-w.min_z);
        const wGeom = new THREE.PlaneGeometry(ww, wd);
        wGeom.rotateX(-Math.PI/2);
        const wMesh = new THREE.Mesh(wGeom, new THREE.MeshStandardMaterial({
            color: 0x1a4a7a, roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.85
        }));
        wMesh.position.set(wx, w.elevation+0.05, wz);
        scene.add(wMesh);
    });
}

// ============================================
// DISTANCE MARKERS
// ============================================
function buildDistanceMarkers() {
    const totalDist = 345;
    [50, 100, 150, 200, 250, 300].forEach(d => {
        const t = d / totalDist;
        const x = TEE.x + (GREEN.x-TEE.x)*t;
        const z = TEE.z + (GREEN.z-TEE.z)*t;
        const y = getH(x, z);

        const canvas = document.createElement('canvas');
        canvas.width = 160; canvas.height = 72;
        const ctx = canvas.getContext('2d');

        // Background pill
        ctx.fillStyle = 'rgba(8, 12, 21, 0.75)';
        ctx.beginPath();
        ctx.roundRect(8, 8, 144, 56, 10);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Distance text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${totalDist - d}`, 72, 42);
        ctx.font = '13px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillText('m', 108, 42);

        // Elevation delta
        const greenH = getH(GREEN.x, GREEN.z);
        const deltaH = Math.round(y - greenH);
        ctx.font = '11px Inter, sans-serif';
        ctx.fillStyle = deltaH > 0 ? '#22c55e' : '#3b82f6';
        ctx.fillText(`${deltaH > 0 ? '↑':'↓'}${Math.abs(deltaH)}m`, 80, 58);

        const tex = new THREE.CanvasTexture(canvas);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
        sprite.position.set(x, y + 14, z);
        sprite.scale.set(14, 6.3, 1);
        scene.add(sprite);
    });
}

// ============================================
// CAMERA PATH — Cinematic drone
// ============================================
function setupCameraPath() {
    const tY = getH(TEE.x, TEE.z);
    const mY = getH(0, 0);
    const gY = getH(GREEN.x, GREEN.z);

    cameraPath.push(
        // Establishing: above & behind tee
        { pos: [TEE.x+35, tY+80, TEE.z-55], look: [0, mY+3, 40] },
        // Over tee
        { pos: [TEE.x+12, tY+55, TEE.z+25], look: [0, mY+2, 110] },
        // Sweeping mid-fairway
        { pos: [18, mY+50, -15], look: [-8, mY+1, 130] },
        // High mid
        { pos: [5, mY+42, 50], look: [GREEN.x, gY, GREEN.z] },
        // Approach
        { pos: [GREEN.x+12, gY+38, GREEN.z-30], look: [GREEN.x, gY, GREEN.z] },
        // Green beauty
        { pos: [GREEN.x+3, gY+52, GREEN.z+8], look: [GREEN.x, gY, GREEN.z] },
        // Final orbit
        { pos: [GREEN.x+22, gY+44, GREEN.z+18], look: [GREEN.x, gY, GREEN.z] }
    );
}

function startFlight() {
    flyProgress = 0; isFlying = true;
    flyStart = performance.now();
    document.getElementById('telemetry').classList.add('visible');
    const btn = document.getElementById('btn-fly');
    btn.innerHTML = '🚁 Flyger...';
    btn.style.background = 'linear-gradient(135deg,#3B82F6,#1D4ED8)';
}

function animate() {
    requestAnimationFrame(animate);

    if (isFlying) {
        const elapsed = (performance.now() - flyStart) / 1000;
        flyProgress = Math.min(elapsed / FLIGHT_DURATION, 1.0);
        const t = smoothstep(flyProgress);

        const totalSeg = cameraPath.length - 1;
        const segF = t * totalSeg;
        const segI = Math.min(Math.floor(segF), totalSeg - 1);
        const segT = smoothstep(segF - segI);

        const from = cameraPath[segI], to = cameraPath[segI + 1];
        camera.position.set(
            lerp(from.pos[0], to.pos[0], segT) + Math.sin(elapsed*0.6)*0.4,
            lerp(from.pos[1], to.pos[1], segT) + Math.sin(elapsed*0.35)*0.2,
            lerp(from.pos[2], to.pos[2], segT)
        );
        camera.lookAt(
            lerp(from.look[0], to.look[0], segT),
            lerp(from.look[1], to.look[1], segT),
            lerp(from.look[2], to.look[2], segT)
        );

        // HUD
        document.getElementById('progress-fill').style.width = (flyProgress*100)+'%';
        document.getElementById('hud-dist').textContent = Math.round(345*(1-t))+'m';
        document.getElementById('alt-val').textContent = Math.round(12 + Math.sin(t*Math.PI)*18);
        document.getElementById('spd-val').textContent = Math.round(28 + t*22 + Math.sin(elapsed*1.3)*4);

        if (flyProgress >= 1.0) {
            isFlying = false;
            const btn = document.getElementById('btn-fly');
            btn.innerHTML = '↻ Spela om';
            btn.style.background = 'linear-gradient(135deg,#10B981,#059669)';
        }
    } else if (cameraPath.length > 0) {
        // Idle orbit at green
        const lp = cameraPath[cameraPath.length-1];
        const time = performance.now()*0.00005;
        camera.position.set(
            lp.pos[0] + Math.sin(time)*20,
            lp.pos[1] + Math.sin(time*1.4)*2,
            lp.pos[2] + Math.cos(time)*15
        );
        camera.lookAt(lp.look[0], lp.look[1], lp.look[2]);
    }

    renderer.render(scene, camera);
}

function smoothstep(t) { t = Math.max(0,Math.min(1,t)); return t*t*(3-2*t); }
function lerp(a,b,t) { return a+(b-a)*t; }

function getH(wx, wz) {
    if (!terrainGrid || !terrainMeta) return 5;
    const w = terrainMeta.width, d = terrainMeta.depth, res = terrainMeta.resolution;
    const ix = Math.max(0, Math.min(res-1, Math.round((wx+w/2)/w*(res-1))));
    const iz = Math.max(0, Math.min(res-1, Math.round((wz+d/2)/d*(res-1))));
    return (terrainGrid[iz] && terrainGrid[iz][ix]) || 5;
}

function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
}
</script>
