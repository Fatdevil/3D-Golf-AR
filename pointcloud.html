<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenRead AR — LiDAR Punktmoln</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a0a12;font-family:'Inter',system-ui,sans-serif;color:#fff}
#container{width:100vw;height:100vh}
canvas{display:block}

.hud{position:absolute;top:0;left:0;right:0;height:50px;
  background:linear-gradient(180deg,rgba(10,10,18,0.95),rgba(10,10,18,0.4));
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:10}
.hud-left{display:flex;flex-direction:column}
.hud-title{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.hud-sub{font-size:11px;color:rgba(255,255,255,0.4)}
.hud-right{display:flex;gap:14px;align-items:center;font-size:12px;color:rgba(255,255,255,0.5)}
.hud-stat{display:flex;flex-direction:column;align-items:center}
.hud-stat .val{font-size:18px;font-weight:700;color:#fff}
.hud-stat .lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.35)}

.legend{position:absolute;bottom:20px;right:20px;background:rgba(10,10,18,0.85);
  backdrop-filter:blur(8px);border-radius:12px;padding:14px 18px;z-index:10;
  border:1px solid rgba(255,255,255,0.08);font-size:12px;display:flex;flex-direction:column;gap:6px}
.legend-item{display:flex;align-items:center;gap:8px}
.legend-dot{width:10px;height:10px;border-radius:50%}

.controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:10px}
.ctrl-btn{border:none;padding:10px 20px;border-radius:25px;font-size:13px;font-weight:600;
  color:#fff;cursor:pointer;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.15);transition:all 0.2s}
.ctrl-btn:hover{background:rgba(255,255,255,0.2)}
.ctrl-btn.active{background:rgba(34,197,94,0.3);border-color:rgba(34,197,94,0.5)}

#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
  text-align:center}
#loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);
  border-top-color:#22c55e;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="container">
  <div class="hud">
    <div class="hud-left">
      <div class="hud-title">Norrmjöle GK — Hål 1</div>
      <div class="hud-sub">Lantmäteriet LiDAR Punktmoln • 300,000 laserpunkter</div>
    </div>
    <div class="hud-right">
      <div class="hud-stat"><span class="val" id="point-count">0</span><span class="lbl">Punkter</span></div>
      <div class="hud-stat"><span class="val">PAR 4</span><span class="lbl">345m</span></div>
    </div>
  </div>

  <div class="legend">
    <div style="font-weight:600;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,0.4)">Punktklasser</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8B7355"></div> Mark (klass 2)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#228B22"></div> Vegetation (klass 1)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2266aa"></div> Vatten (klass 9)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff4444"></div> Tee / Green</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn active" onclick="setColorMode('class')">Klassificering</button>
    <button class="ctrl-btn" onclick="setColorMode('height')">Höjd</button>
    <button class="ctrl-btn" onclick="setColorMode('intensity')">Intensitet</button>
    <button class="ctrl-btn" onclick="toggleFly()">🚁 Flyover</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Laddar 300,000 laserpunkter...</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let scene, camera, renderer, controls;
let pointCloud, cloudData;
let isFlying = false, flyStart = 0;
const FLIGHT_DURATION = 18;

init();

async function init() {
    const container = document.getElementById('container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);

    camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 2000);
    camera.position.set(100, 120, -250);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 800;
    controls.minDistance = 10;

    // Subtle grid for reference
    const grid = new THREE.GridHelper(500, 50, 0x222233, 0x111122);
    grid.position.y = -0.5;
    scene.add(grid);

    // Load point cloud
    try {
        const resp = await fetch('data/pointcloud_hole1.json');
        cloudData = await resp.json();
        buildPointCloud(cloudData, 'class');
        document.getElementById('point-count').textContent = cloudData.count.toLocaleString();
        document.getElementById('loading').style.display = 'none';

        // Add tee/green markers
        addMarker(cloudData.tee.x, cloudData.tee.z, 0xff4444, 'TEE');
        addMarker(cloudData.green.x, cloudData.green.z, 0x44ff44, 'GREEN');

    } catch(e) {
        console.error('Failed to load point cloud:', e);
        document.getElementById('loading').innerHTML = '<div style="color:#f44">Kunde inte ladda data</div>';
    }

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });

    animate();
}

function buildPointCloud(data, colorMode) {
    if (pointCloud) scene.remove(pointCloud);

    const count = data.count;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    const zMin = Math.min(...data.z.slice(0, 1000)); // sample
    const zMax = Math.max(...data.z.slice(0, 1000));

    for (let i = 0; i < count; i++) {
        // x = east-west, z (in data) = north-south → Three.js z
        // y (in Three.js) = elevation
        positions[i * 3] = data.x[i];       // x → x
        positions[i * 3 + 1] = data.z[i];   // elevation → y
        positions[i * 3 + 2] = data.y[i];   // northing → z

        let r, g, b;
        const cls = data.cls[i];
        const h = data.z[i];

        if (colorMode === 'class') {
            if (cls === 2) {
                // Ground — warm brown/tan, height-tinted
                const t = Math.max(0, Math.min(1, h / 15));
                r = 0.45 + t * 0.15;
                g = 0.35 + t * 0.15;
                b = 0.2 + t * 0.05;
            } else if (cls === 1) {
                // Vegetation — green spectrum based on height
                const t = Math.max(0, Math.min(1, h / 25));
                r = 0.05 + t * 0.05;
                g = 0.25 + t * 0.4;
                b = 0.05 + t * 0.08;
            } else if (cls === 9) {
                // Water — blue
                r = 0.1; g = 0.3; b = 0.65;
            } else {
                // Other (noise etc)
                r = 0.3; g = 0.3; b = 0.3;
            }
        } else if (colorMode === 'height') {
            // Elevation heat map
            const t = Math.max(0, Math.min(1, h / 30));
            if (t < 0.25) { r = 0.1; g = 0.2 + t*3; b = 0.5 - t*2; }
            else if (t < 0.5) { r = (t-0.25)*4; g = 0.9; b = 0; }
            else if (t < 0.75) { r = 1; g = 1 - (t-0.5)*4; b = 0; }
            else { r = 1; g = 0; b = (t-0.75)*2; }
        } else {
            // Intensity — grayscale by height
            const v = Math.max(0.1, Math.min(0.9, h / 20));
            r = g = b = v;
        }

        // Add slight random variation
        const noise = (Math.random() - 0.5) * 0.03;
        colors[i * 3] = Math.max(0, Math.min(1, r + noise));
        colors[i * 3 + 1] = Math.max(0, Math.min(1, g + noise));
        colors[i * 3 + 2] = Math.max(0, Math.min(1, b + noise));
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: 1.5,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.85,
    });

    pointCloud = new THREE.Points(geometry, material);
    scene.add(pointCloud);
}

function addMarker(x, z, color, label) {
    // Vertical line
    const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, 0, z),
        new THREE.Vector3(x, 40, z)
    ]);
    const lineMat = new THREE.LineBasicMaterial({ color, linewidth: 2 });
    scene.add(new THREE.Line(lineGeom, lineMat));

    // Sprite label
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 48;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = `#${color.toString(16).padStart(6,'0')}`;
    ctx.font = 'bold 28px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, 64, 34);

    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sprite.position.set(x, 45, z);
    sprite.scale.set(20, 8, 1);
    scene.add(sprite);
}

function setColorMode(mode) {
    document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (cloudData) buildPointCloud(cloudData, mode);
}

function toggleFly() {
    isFlying = !isFlying;
    if (isFlying) {
        flyStart = performance.now();
        controls.enabled = false;
    } else {
        controls.enabled = true;
    }
}

function animate() {
    requestAnimationFrame(animate);

    if (isFlying && cloudData) {
        const elapsed = (performance.now() - flyStart) / 1000;
        const t = Math.min(elapsed / FLIGHT_DURATION, 1.0);
        const s = t * t * (3 - 2 * t); // smoothstep

        const tee = cloudData.tee;
        const green = cloudData.green;

        // Camera follows fairway path
        const cx = tee.x + (green.x - tee.x) * s;
        const cz = tee.z + (green.z - tee.z) * s;

        // Height curve — high, dip mid, rise for green
        const altitude = 60 + Math.sin(s * Math.PI) * -25;

        // Offset to side for cinematic angle
        const perpX = -(green.z - tee.z) / 345;
        const perpZ = (green.x - tee.x) / 345;

        camera.position.set(
            cx + perpX * 40 + Math.sin(elapsed * 0.5) * 5,
            altitude,
            cz + perpZ * 40
        );

        // Look ahead
        const lookT = Math.min(s + 0.15, 1.0);
        const lx = tee.x + (green.x - tee.x) * lookT;
        const lz = tee.z + (green.z - tee.z) * lookT;
        camera.lookAt(lx, 5, lz);

        if (t >= 1.0) {
            isFlying = false;
            controls.enabled = true;
            controls.target.set(green.x, 5, green.z);
        }
    } else {
        controls.update();
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
