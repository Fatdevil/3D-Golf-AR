<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf OS | Mobile Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --primary: #10b981;
            --text-main: #f8fafc;
            --border-glass: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Inter', sans-serif; color: var(--text-main); }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        
        /* MOBILE UI OVERLAY */
        #mobile-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* TOP BAR */
        .top-bar { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(15,23,42,0.8), transparent); pointer-events: auto; }
        .hole-info { font-family: 'Outfit', sans-serif; }
        .hole-number { font-size: 24px; font-weight: 800; display: block; }
        .hole-par { font-size: 14px; color: rgba(255,255,255,0.7); }
        
        .player-info { text-align: right; }
        .player-name { font-size: 16px; font-weight: 600; }
        .player-score { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: var(--primary); }
        
        /* BOTTOM CONTROLS */
        .bottom-controls { padding: 20px; background: linear-gradient(to top, rgba(15,23,42,0.9), transparent); pointer-events: auto; display: flex; flex-direction: column; gap: 16px; }
        
        /* CLUB SELECTOR */
        .club-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .club-selector::-webkit-scrollbar { display: none; }
        .club-btn { background: rgba(30,41,59,0.8); border: 1px solid var(--border-glass); border-radius: 12px; padding: 12px 20px; color: white; font-weight: 600; font-size: 16px; flex-shrink: 0; transition: 0.2s; }
        .club-btn.active, .club-btn.selected { background: var(--primary); border-color: var(--primary); color: #0f172a; }
        
        /* SHOT SHAPE (draw / straight / fade), wired to SwingEngine.setShotShape */
        .shape-selector { display: flex; justify-content: center; }
        .shape-btn { min-width: 84px; min-height: 44px; padding: 10px 16px; background: rgba(30,41,59,0.8); border: 1px solid var(--border-glass); border-right: none; color: rgba(255,255,255,0.7); font-family: inherit; font-size: 15px; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        .shape-btn:first-child { border-radius: 12px 0 0 12px; }
        .shape-btn:last-child { border-radius: 0 12px 12px 0; border-right: 1px solid var(--border-glass); }
        .shape-btn.selected { background: var(--primary); border-color: var(--primary); color: #0f172a; }

        /* SWING METER CONTAINER */
        #swing-ui-container { height: 60px; position: relative; background: rgba(0,0,0,0.5); border-radius: 30px; border: 2px solid rgba(255,255,255,0.2); overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        /* POPUPS */
        .fullscreen-popup { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15,23,42,0.95); z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; opacity: 0; transition: opacity 0.3s; }
        .popup-title { font-family: 'Outfit', sans-serif; font-size: 48px; font-weight: 800; margin-bottom: 12px; text-align: center; }
        .popup-desc { font-size: 18px; color: rgba(255,255,255,0.7); margin-bottom: 32px; }
        .btn-primary { background: var(--primary); color: #0f172a; border: none; border-radius: 12px; padding: 16px 32px; font-size: 18px; font-weight: 700; font-family: 'Outfit', sans-serif; }

        /* SWING ENGINE CSS */
        #swing-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 50; display: none; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #swing-overlay.active { display: flex; opacity: 1; pointer-events: auto; }
        #swing-circle-container { position: relative; width: 260px; height: 260px; }
        #swing-svg { width: 100%; height: 100%; transform: rotate(0deg); }
        .zone-miss { stroke: rgba(239,68,68,0.2); }
        .zone-ok { stroke: rgba(250,204,21,0.5); }
        .zone-perfect { stroke: rgba(16,185,129,0.8); }
        #power-ring-track { stroke: rgba(255,255,255,0.05); }
        #power-ring-fill { stroke: #38bdf8; stroke-linecap: round; transition: stroke-dashoffset 0.05s linear; }
        #dir-arm { position: absolute; top: 50%; left: 50%; width: 4px; height: 120px; background: #f8fafc; border-radius: 2px; transform-origin: top center; box-shadow: 0 0 10px rgba(255,255,255,0.5); transition: transform 0.05s linear; }
        #dir-arm::after { content: ''; position: absolute; bottom: -6px; left: -4px; width: 12px; height: 12px; background: #38bdf8; border-radius: 50%; }
        #swing-label { position: absolute; top: -50px; left: 0; right: 0; text-align: center; color: white; font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; }
        #swing-metrics { position: absolute; bottom: -60px; left: 0; right: 0; text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 600; display: flex; justify-content: center; gap: 16px; }
        
        .swing-trigger-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; border-radius: 50%; background: var(--primary); border: 4px solid rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); display: flex; justify-content: center; align-items: center; color: #0f172a; font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; cursor: pointer; user-select: none; z-index: 20; }
        .swing-trigger-btn:active { transform: translateX(-50%) scale(0.95); background: #059669; }

        /* LAUNCH MONITOR DATA PANEL */
        #lm-data-panel { position: absolute; bottom: 20px; left: 10px; width: auto; display: none; opacity: 0; flex-direction: column; gap: 8px; z-index: 60; transition: opacity 0.4s, transform 0.4s; transform: translateX(-20px); font-family: 'Outfit', sans-serif; }
        #lm-data-panel.active { display: flex; opacity: 1; transform: translateX(0); }
        .lm-header { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 12px; margin-bottom: 2px; }
        .lm-title { color: #38bdf8; font-weight: 700; font-size: 12px; letter-spacing: 1px; }
        .lm-badge { background: rgba(56, 189, 248, 0.2); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-left: 10px; }
        
        .lm-content { display: flex; flex-direction: column; gap: 6px; }
        
        .lm-grid { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
        .lm-stat { display: flex; flex-direction: column; align-items: flex-start; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); width: fit-content; }
        .lm-stat-label { color: rgba(255,255,255,0.6); font-size: 8px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1px; }
        .lm-stat-value { color: white; font-size: 13px; font-weight: 800; font-family: monospace; }
        .lm-stat-value.highlight { color: #10b981; }

        /* DISTANCE PANEL (CARRY / TOTAL) */
        #distance-panel { position: absolute; top: 80px; left: 15px; display: none; opacity: 0; flex-direction: column; gap: 4px; z-index: 50; transition: opacity 0.4s; pointer-events: none; }
        #distance-panel.active { display: flex; opacity: 1; }
        .dist-row { display: flex; align-items: baseline; gap: 6px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .dist-label { color: rgba(255,255,255,0.8); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; width: 45px; }
        .dist-value { color: white; font-size: 22px; font-weight: 800; font-family: 'Outfit', sans-serif; }
        .dist-unit { color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600; }

    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="mobile-ui">
        
        <!-- DISTANCE PANEL (CARRY / TOTAL) -->
        <div id="distance-panel">
            <div class="dist-row">
                <div class="dist-label">Carry</div>
                <div class="dist-value" id="dist-carry">-</div>
                <div class="dist-unit">m</div>
            </div>
            <div class="dist-row" id="dist-total-row" style="display: none;">
                <div class="dist-label">Total</div>
                <div class="dist-value" id="dist-total">-</div>
                <div class="dist-unit">m</div>
            </div>
        </div>

        <div class="top-bar">
            <div class="hole-info">
                <span class="hole-number" id="ui-hole">Hole 1</span>
                <span class="hole-par" id="ui-par">Par 4 | 420m</span>
            </div>
            <div class="player-info">
                <div class="player-name" id="ui-player-name">Player 1</div>
                <div class="player-score" id="ui-player-score">0</div>
            </div>
        </div>
        
        <div class="bottom-controls">
            <div class="shape-selector" id="ui-shape">
                <button class="shape-btn" data-shape="-1" aria-label="Draw, kurvar åt vänster" onclick="SwingEngine.setShotShape(-1)">↶ Draw</button>
                <button class="shape-btn selected" data-shape="0" aria-label="Rak" onclick="SwingEngine.setShotShape(0)">Rak</button>
                <button class="shape-btn" data-shape="1" aria-label="Fade, kurvar åt höger" onclick="SwingEngine.setShotShape(1)">Fade ↷</button>
            </div>
            <div class="club-selector" id="ui-clubs">
                <div class="club-btn selected" data-club="DRIVER" onclick="SwingEngine.selectClub('DRIVER')">Dr</div>
                <div class="club-btn" data-club="W3" onclick="SwingEngine.selectClub('W3')">3W</div>
                <div class="club-btn" data-club="I5" onclick="SwingEngine.selectClub('I5')">5i</div>
                <div class="club-btn" data-club="I7" onclick="SwingEngine.selectClub('I7')">7i</div>
                <div class="club-btn" data-club="I9" onclick="SwingEngine.selectClub('I9')">9i</div>
                <div class="club-btn" data-club="PW" onclick="SwingEngine.selectClub('PW')">PW</div>
                <div class="club-btn" data-club="SW" onclick="SwingEngine.selectClub('SW')">SW</div>
                <div class="club-btn" data-club="LW" onclick="SwingEngine.selectClub('LW')">LW</div>
                <div class="club-btn" data-club="PUTT" onclick="SwingEngine.selectClub('PUTT')">Pt</div>
            </div>
            <!-- Removed #swing-ui-container, replaced with absolute trigger button -->
        </div>
    </div>
    
    <div class="swing-trigger-btn" id="main-swing-btn">SWING</div>

    <!-- SWING OVERLAY (From arcade-swing-engine.js) -->
    <div id="swing-overlay">
        <div id="swing-circle-container">
            <div id="swing-label">TAP TO SET POWER</div>
            <svg id="swing-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
                <circle cx="130" cy="130" r="118" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="2"/>
                <circle cx="130" cy="130" r="100" fill="none" stroke-width="18" class="zone-miss" stroke-dasharray="628" stroke-dashoffset="0" transform="rotate(-90 130 130)"/>
                <!-- Yellow "Good" zone: ~20% of circle = 125 units. Offset = 125/2 = 62.5 -->
                <circle cx="130" cy="130" r="100" fill="none" stroke-width="18" class="zone-ok" stroke-dasharray="126 502" stroke-dashoffset="63" transform="rotate(-90 130 130)"/>
                <!-- Green "Perfect" zone: ~6% of circle = 38 units. Offset = 38/2 = 19 -->
                <circle cx="130" cy="130" r="100" fill="none" stroke-width="18" class="zone-perfect" stroke-dasharray="38 590" stroke-dashoffset="19" transform="rotate(-90 130 130)"/>
                <circle id="power-ring-track" cx="130" cy="130" r="100" stroke-width="8" stroke-dasharray="628" stroke-dashoffset="0" transform="rotate(-90 130 130)"/>
                <circle id="power-ring-fill" cx="130" cy="130" r="100" stroke-width="8" stroke-dasharray="628" stroke-dashoffset="628" transform="rotate(-90 130 130)"/>
            </svg>
            <div id="dir-arm" style="transform: rotate(180deg);"></div>
            <div id="swing-metrics">
                <span>PWR: <span id="pwr-val" style="color:white">--</span>%</span>
                <span>DIR: <span id="dir-val" style="color:white">--</span>°</span>
            </div>
        </div>
    </div>

    <!-- LM DATA PANEL -->
    <div id="lm-data-panel">
        <div class="lm-header">
            <span class="lm-title">TRACK DATA</span>
            <span class="lm-badge">LIVE</span>
        </div>
        <div class="lm-content">
            <div class="lm-grid">
                <div class="lm-stat">
                    <span class="lm-stat-label">CLUB SPEED</span>
                    <span class="lm-stat-value" id="lm-club-speed">-- mph</span>
                </div>
                <div class="lm-stat">
                    <span class="lm-stat-label">BALL SPEED</span>
                    <span class="lm-stat-value highlight" id="lm-ball-speed">-- mph</span>
                </div>
                <div class="lm-stat">
                    <span class="lm-stat-label">SMASH FAC</span>
                    <span class="lm-stat-value" id="lm-smash">--</span>
                </div>
                <div class="lm-stat">
                    <span class="lm-stat-label">LAUNCH</span>
                    <span class="lm-stat-value" id="lm-launch">--°</span>
                </div>
                <div class="lm-stat">
                    <span class="lm-stat-label">SPIN RATE</span>
                    <span class="lm-stat-value" id="lm-spin">-- rpm</span>
                </div>
                <div class="lm-stat">
                    <span class="lm-stat-label">SPIN AXIS</span>
                    <span class="lm-stat-value" id="lm-axis">--°</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Popups -->
    <div class="fullscreen-popup" id="popup-result">
        <div class="popup-title" id="popup-title">HOLED OUT!</div>
        <div class="popup-desc" id="popup-desc">Score: 4 (Par)</div>
        <button class="btn-primary" onclick="closePopup()">Continue</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="physics.js"></script>
    <script src="arcade-api-service.js"></script>
    <script src="arcade-game-core.js"></script>
    <script src="arcade-swing-engine.js"></script>

    <script>
        lucide.createIcons();

        
        // Resample Utility
        window._resampleHeightmap = function(srcArr, srcSegs, dstSegs) {
            let srcStride = srcSegs + 1;
            let dstStride = dstSegs + 1;
            let result = new Array(dstStride * dstStride);
            for (let dz = 0; dz < dstStride; dz++) {
                for (let dx = 0; dx < dstStride; dx++) {
                    let sx = (dx / dstSegs) * srcSegs;
                    let sz = (dz / dstSegs) * srcSegs;
                    let x0 = Math.floor(sx), x1 = Math.min(x0 + 1, srcSegs);
                    let z0 = Math.floor(sz), z1 = Math.min(z0 + 1, srcSegs);
                    let fx = sx - x0, fz = sz - z0;
                    let h00 = srcArr[z0 * srcStride + x0] || 0;
                    let h10 = srcArr[z0 * srcStride + x1] || 0;
                    let h01 = srcArr[z1 * srcStride + x0] || 0;
                    let h11 = srcArr[z1 * srcStride + x1] || 0;
                    result[dz * dstStride + dx] = (h00*(1-fx)*(1-fz) + h10*fx*(1-fz) + h01*(1-fx)*fz + h11*fx*fz);
                }
            }
            return result;
        };

        async function initMobileArcade() {
            // 1. DATA RECEIVER
            const rawData = localStorage.getItem('golf_os_mobile_match');
            const matchData = rawData ? JSON.parse(rawData) : { settings: { gimmeDist: 10, autoPutt: 'TOUR_PRO', autoConcede: 99 }, players: [{ name: 'Player 1', color: '#ef4444' }] };
            
            let courseCode = matchData.courseCode;
            if (!courseCode) {
                const params = new URLSearchParams(window.location.search);
                courseCode = params.get('course') || '2593d6e5-4a57-41e9-91ee-0a2db7f90117'; 
            }

            let coursePayload = null;
            if (courseCode && window.ArcadeAPI) {
                try {
                    const res = await window.ArcadeAPI.loadCourse(courseCode);
                    if (res.share_code) coursePayload = res;
                } catch(e) { console.error("Course load failed", e); }
            }

            window.GolfEngine.initPlayers(matchData.players);
            window.GolfEngine.updateSettings(matchData.settings);
            
            // 2. SCENE SETUP
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
            
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; 
            controls.enablePan = false; 
            controls.enableZoom = false; 
            
            const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 50);
            scene.add(dirLight);
            
            // 3. TERRAIN
            const TERRAIN_SIZE = 900;
            const TERRAIN_SEGS = 400; 
            const planeGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS);
            planeGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);
            
            const pCanvas = document.createElement('canvas');
            pCanvas.width = 4096; pCanvas.height = 4096;
            const pCtx = pCanvas.getContext('2d');
            pCtx.fillStyle = '#4ade80';
            pCtx.fillRect(0, 0, 4096, 4096);
            const mapTex = new THREE.CanvasTexture(pCanvas);
            
            const planeMat = new THREE.MeshStandardMaterial({ map: mapTex, roughness: 0.8 });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);
            
            window.getTerrainHeight = function(worldX, worldZ) {
                let positions = planeGeo.attributes.position.array;
                let half = TERRAIN_SIZE / 2;
                let step = TERRAIN_SIZE / TERRAIN_SEGS;
                let gx = (worldX + half) / step;
                let gz = (worldZ + half) / step;
                gx = Math.max(0, Math.min(TERRAIN_SEGS - 1, gx));
                gz = Math.max(0, Math.min(TERRAIN_SEGS - 1, gz));
                let ix = Math.floor(gx), iz = Math.floor(gz);
                let fx = gx - ix, fz = gz - iz;
                let stride = TERRAIN_SEGS + 1;
                let i00 = (iz * stride + ix) * 3 + 2;
                let i10 = (iz * stride + (ix + 1)) * 3 + 2;
                let i01 = ((iz + 1) * stride + ix) * 3 + 2;
                let i11 = ((iz + 1) * stride + (ix + 1)) * 3 + 2;
                let h00 = positions[i00] || 0;
                let h10 = positions[i10] || 0;
                let h01 = positions[i01] || 0;
                let h11 = positions[i11] || 0;
                return h00*(1-fx)*(1-fz) + h10*fx*(1-fz) + h01*(1-fx)*fz + h11*fx*fz;
            };

            window.courseHoles = [];
            let startPos = new THREE.Vector3(0, 0, 0);
            let holePos = new THREE.Vector3(0, 0, -50);
            
            window.biomeDataCache = null;
            if (coursePayload) {
                if (coursePayload.terrain_biomemap) {
                    let img = new Image();
                    img.onload = () => {
                        pCtx.drawImage(img, 0, 0);
                        mapTex.needsUpdate = true;
                        try {
                            window.biomeDataCache = pCtx.getImageData(0, 0, 4096, 4096).data;
                        } catch(e) { console.warn("Could not cache biome data (CORS/taint issue)", e); }
                    };
                    img.src = coursePayload.terrain_biomemap;
                }
                if (coursePayload.terrain_heightmap) {
                    let mapData = (typeof coursePayload.terrain_heightmap === 'string') ? JSON.parse(coursePayload.terrain_heightmap) : coursePayload.terrain_heightmap;
                    let groundArr = Array.isArray(mapData) ? mapData : mapData.ground;
                    if (groundArr) {
                        let savedSegs = mapData.segs || Math.round(Math.sqrt(groundArr.length) - 1);
                        let heightData = groundArr;
                        if (savedSegs !== TERRAIN_SEGS && savedSegs > 0) {
                            heightData = window._resampleHeightmap(groundArr, savedSegs, TERRAIN_SEGS);
                        }
                        let pos = planeGeo.attributes.position;
                        let vertCount = (TERRAIN_SEGS + 1) * (TERRAIN_SEGS + 1);
                        for(let i=0; i<vertCount && i<heightData.length; i++) {
                            pos.setZ(i, heightData[i]);
                        }
                        pos.needsUpdate = true;
                        planeGeo.computeVertexNormals();
                    }
                }
                let holesStr = coursePayload.holes;
                if (typeof holesStr === 'string') holesStr = JSON.parse(holesStr);
                if (holesStr && holesStr.length > 0) {
                    window.courseHoles = holesStr;
                    let h1 = holesStr[0];
                    if (h1.tees && h1.tees.yellow) {
                        let tz = window.getTerrainHeight(h1.tees.yellow.x, h1.tees.yellow.z);
                        startPos.set(h1.tees.yellow.x, tz, h1.tees.yellow.z);
                    }
                    if (h1.flag) {
                        let tz = window.getTerrainHeight(h1.flag.x, h1.flag.z);
                        holePos.set(h1.flag.x, tz, h1.flag.z);
                    }
                    document.getElementById('ui-par').innerText = `Par ${h1.par} | ${Math.round(startPos.distanceTo(holePos)*1.09361)}yd`;
                }
            }
            
            // 4. OBJECTS
            const textureLoader = new THREE.TextureLoader();
            const ballTex = textureLoader.load('golfball-texture.png');
            
            // SphereGeometry(radius, widthSegments, heightSegments)
            // Normal golf ball is 0.042m, but making it slightly larger (0.06m) helps visibility on mobile
            const ballGeo = new THREE.SphereGeometry(0.06, 32, 32);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, map: ballTex });
            const ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.copy(startPos);
            ball.position.y += 0.06;
            
            // Add a small local rotation axis helper to the ball (optional, but good for testing)
            // ball.add(new THREE.AxesHelper(0.1));
            
            scene.add(ball);
            window.ballMesh = ball;
            
            const flagMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const flagGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
            const flag = new THREE.Mesh(flagGeo, flagMat);
            flag.position.copy(holePos);
            flag.position.y += 1;
            scene.add(flag);
            
            controls.target.copy(ball.position);
            // Position camera slightly behind and above ball, looking towards hole
            let dirToHole = new THREE.Vector3().subVectors(holePos, ball.position).normalize();
            if (dirToHole.length() < 0.01) dirToHole.set(0, 0, -1);
            camera.position.copy(ball.position).sub(dirToHole.multiplyScalar(3)).add(new THREE.Vector3(0, 1.5, 0));
            controls.update();
            
            // 5. GAME LOOP & STATE
            let isFlying = false;
            let flightData = {};
            let flightIndex = 0;
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                
                if (isFlying && flightData && flightData.positions) {
                    if (flightIndex < flightData.positions.length) {
                        let p = flightData.positions[flightIndex];
                        
                        // Physics: p.x (right), p.y (forward), p.z (up)
                        // Three.js: X (right), Y (up), Z (depth, negative is forward)
                        let targetX = p.x;
                        let targetY = p.z;
                        let targetZ = -p.y;

                        let diffX = targetX - ball.position.x;
                        let diffY = targetY - ball.position.y;
                        let diffZ = targetZ - ball.position.z;
                        
                        ball.position.set(targetX, targetY, targetZ);
                        controls.target.copy(ball.position); 
                        
                        camera.position.x += diffX;
                        camera.position.y += diffY;
                        camera.position.z += diffZ;
                        
                        // Rotate the ball mesh to visualize spin
                        if (flightData.spinRpm) {
                            // If ball is on the ground, decay the spin rapidly to simulate friction
                            if (p.phase === "bounce" || p.phase === "skid" || p.phase === "roll") {
                                flightData.spinRpm *= 0.95; // loses 5% spin every frame on ground
                                flightData.spinAxis *= 0.95; // axis straightens out
                            }

                            // Convert RPM to radians per frame (approx 60fps)
                            let rotSpeed = (flightData.spinRpm * Math.PI * 2) / 3600;
                            // Reduce visual speed slightly so it doesn't just strobe
                            rotSpeed *= 0.3; 
                            
                            let axisRad = (flightData.spinAxis || 0) * Math.PI / 180;
                            
                            // Calculate exact current flight direction
                            let moveDir = new THREE.Vector3(diffX, 0, diffZ);
                            if (moveDir.lengthSq() > 0.000001) {
                                moveDir.normalize();
                            } else {
                                // Fallback if not moving horizontally
                                moveDir.set(0, 0, -1);
                            }
                            
                            // Right vector is perpendicular to moveDir and UP
                            let up = new THREE.Vector3(0, 1, 0);
                            let right = new THREE.Vector3().crossVectors(moveDir, up).normalize();
                            
                            // Pure backspin rotates around the negative Right vector
                            // Right hand rule: rotating around -Right makes the top of the ball move along moveDir
                            let rotAxis = right.clone().multiplyScalar(-1);
                            
                            // Fade/Draw tilts this axis around the Forward vector (moveDir)
                            rotAxis.applyAxisAngle(moveDir, axisRad);
                            
                            ball.rotateOnWorldAxis(rotAxis.normalize(), rotSpeed);
                        }
                        
                        // Live Distance Update
                        let distMeters = Math.sqrt(Math.pow(ball.position.x - flightData.shotStartPos.x, 2) + Math.pow(ball.position.z - flightData.shotStartPos.z, 2));
                        
                        // If still flying, update Carry. Once it hits ground, lock Carry and update Total.
                        if (p.phase === "flight") {
                            document.getElementById('dist-carry').innerText = distMeters.toFixed(1);
                        } else {
                            if (!flightData.carryLocked) {
                                flightData.carryLocked = true;
                                document.getElementById('dist-total-row').style.display = 'flex';
                            }
                            document.getElementById('dist-total').innerText = distMeters.toFixed(1);
                        }

                        flightIndex += 2;
                    } else {
                        isFlying = false;
                        
                        // Force the UI to match the exact physics resting place
                        if (flightData.metrics && flightData.metrics.totalMeters) {
                            document.getElementById('dist-total').innerText = flightData.metrics.totalMeters.toFixed(1);
                        }
                        
                        let player = window.GolfEngine.getActivePlayer();
                        player.strokes++;
                        window.GolfEngine.emit('GolfEvent_BallStopped', { player });
                    }
                }

                renderer.render(scene, camera);
            }
            animate();
            
            // 6. EVENT LISTENERS
            window.addEventListener('GolfEvent_HoledOut', (e) => {
                showPopup('HOLED OUT!', `Score: ${e.detail.total}`, '#10b981');
                updateUI();
            });
            window.addEventListener('GolfEvent_GimmeAwarded', (e) => {
                showPopup('GIMME!', `+${e.detail.putts} Putt(s)`, '#fcd34d');
                updateUI();
            });
            window.addEventListener('GolfEvent_BallStopped', (e) => {
                updateUI();
            });
            
            function updateUI() {
                const p = window.GolfEngine.getActivePlayer();
                document.getElementById('ui-player-name').innerText = p.name;
                document.getElementById('ui-player-score').innerText = p.strokes + p.penaltyStrokes;
            }
            
            function showPopup(title, desc, color) {
                const p = document.getElementById('popup-result');
                document.getElementById('popup-title').innerText = title;
                document.getElementById('popup-title').style.color = color;
                document.getElementById('popup-desc').innerText = desc;
                p.style.display = 'flex';
                setTimeout(() => p.style.opacity = '1', 50);
            }
            
            window.closePopup = function() {
                const p = document.getElementById('popup-result');
                p.style.opacity = '0';
                setTimeout(() => p.style.display = 'none', 300);
            };
            
            updateUI();

            // 7. SWING ENGINE INTEGRATION
            window.playingHoleIndex = 0;
            window.currentBallSurface = 'FAIRWAY';
            window.GREEN_STIMP = 10;
            window.formatDistStr = (m) => (m*1.09361).toFixed(0) + 'yd';
            
            let checkSwing = setInterval(() => {
                if (window.SwingEngine) {
                    clearInterval(checkSwing);
                    window.SwingEngine.enableSwingMode();
                }
            }, 100);

            let lastTapTime = 0;
            function safeTap(e) {
                if (e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                let now = performance.now();
                if (now - lastTapTime > 200) { // 200ms debounce to prevent double-firing
                    lastTapTime = now;
                    if(window.handleSwingTap) window.handleSwingTap(e);
                }
            }

            document.getElementById('main-swing-btn').addEventListener('pointerdown', safeTap);
            document.getElementById('swing-overlay').addEventListener('pointerdown', safeTap);

            window.triggerRealShot = function(physicsData) {
                console.log("BOOM! Firing Shot:", physicsData);
                document.getElementById('swing-overlay').classList.remove('active');
                
                let camAzim = controls.getAzimuthalAngle(); 
                let forward = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), camAzim);
                
                // Set startPos directly in physicsData so it knows where to spawn the ball
                physicsData.startPos = [ball.position.x, ball.position.y, ball.position.z];
                
                // We add the camAzim to the physicsData.azimDeg.
                // Physics: X (right), Y (forward), Z (up).
                // ThreeJS: X (right), Y (up), Z (depth, negative is forward).
                // So physics startPos is [X, -Z, Y].
                physicsData.startPos = [ball.position.x, -ball.position.z, ball.position.y];
                
                let holeAzim = Math.atan2(holePos.x - ball.position.x, holePos.z - ball.position.z);
                let aimOffset = camAzim - holeAzim; 
                physicsData.azimDeg = (physicsData.azimDeg || 0) + (aimOffset * 180 / Math.PI) + 180; 
                
                const simResult = window.GolfPhysics.simulateFlight(physicsData, {
                    getTerrainAt: (x, y, z) => {
                        let ty = window.getTerrainHeight ? window.getTerrainHeight(x, -y) : 0;
                        let tType = 'FAIRWAY';
                        
                        if (window.biomeDataCache) {
                            let TERRAIN_SIZE = 900;
                            // Map world coordinates to 0-4096 pixel space
                            let gx = (x + TERRAIN_SIZE/2) / TERRAIN_SIZE * 4096;
                            let gy = (-y + TERRAIN_SIZE/2) / TERRAIN_SIZE * 4096; // Physics Y maps to ThreeJS -Z
                            let ix = Math.max(0, Math.min(4095, Math.floor(gx)));
                            let iy = Math.max(0, Math.min(4095, Math.floor(gy)));
                            
                            let idx = (iy * 4096 + ix) * 4;
                            let r = window.biomeDataCache[idx];
                            let g = window.biomeDataCache[idx+1];
                            let b = window.biomeDataCache[idx+2];
                            
                            if (b > 180) tType = 'WATER';
                            else if (r > 200 && g > 200) tType = 'SAND';
                            else if (g < 120) tType = 'ROUGH';
                            else if (g > 210 && b > 110) tType = 'GREEN';
                        }
                        
                        return { z: ty, normal: [0, 0, 1], type: tType };
                    }
                });
                
                let p0 = simResult.path[0];
                let p1 = simResult.path[Math.min(10, simResult.path.length - 1)];
                let dx = p1.x - p0.x;
                let dz = -p1.y - (-p0.y); 
                let actualFlightAzim = Math.atan2(dx, dz);
                
                // Reset ball rotation and align the vertical texture stripe exactly with the physical flight path
                ball.rotation.set(0, actualFlightAzim, 0);
                
                flightData = {
                    positions: simResult.path,
                    carryLocked: false,
                    shotStartPos: { x: ball.position.x, z: ball.position.z },
                    spinRpm: physicsData.totalSpinRpm || 0,
                    spinAxis: physicsData.spinAxisDeg || 0,
                    metrics: {
                        holed: simResult.metrics.holed || false,
                        finalTerrainType: 'FAIRWAY',
                        carryMeters: simResult.metrics.carryDistMeters || 0,
                        totalMeters: simResult.metrics.totalMeters || 0
                    }
                };
                flightIndex = 0;
                isFlying = true;

                // Show Distance Panel
                const distPanel = document.getElementById('distance-panel');
                document.getElementById('dist-carry').innerText = "0.0";
                document.getElementById('dist-total-row').style.display = 'none';
                distPanel.classList.add('active');

                // POPULATE & SHOW LM DATA PANEL
                if (physicsData.impactData) {
                    const impact = physicsData.impactData;
                    
                    // Calculate Smash Factor based on offset (perfect = 1.48, extreme miss = 1.20)
                    let smashFactor = 1.48 - (impact.offset * 0.28);
                    if (impact.offset > 0.9) smashFactor = 1.20; // Skull
                    
                    const clubSpeed = physicsData.ballSpeedMph / smashFactor;
                    
                    document.getElementById('lm-club-speed').innerText = clubSpeed.toFixed(1) + ' mph';
                    document.getElementById('lm-ball-speed').innerText = physicsData.ballSpeedMph.toFixed(1) + ' mph';
                    document.getElementById('lm-smash').innerText = smashFactor.toFixed(2);
                    document.getElementById('lm-launch').innerText = (physicsData.launchAngleDeg || 0).toFixed(1) + '°';
                    document.getElementById('lm-spin').innerText = (physicsData.totalSpinRpm || 0).toFixed(0) + ' rpm';
                    
                    const axis = physicsData.spinAxisDeg || 0;
                    const axisStr = axis === 0 ? '0°' : (axis > 0 ? `+${axis.toFixed(1)}° R` : `${axis.toFixed(1)}° L`);
                    document.getElementById('lm-axis').innerText = axisStr;
                    
                    // Show panel
                    const panel = document.getElementById('lm-data-panel');
                    panel.classList.add('active');
                    
                    // Hide after a while or when next shot starts
                    setTimeout(() => {
                        if(isFlying) panel.classList.remove('active');
                    }, 8000);
                }
            };
        }

        initMobileArcade();
</script>
</body>
</html>
