<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GreenRead AR — 3D Flyover</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background: #0a1628; 
      font-family: 'Inter', sans-serif;
    }
    
    #flyover-container { 
      width: 100%; 
      height: 100dvh; 
      position: absolute; 
      inset: 0; 
      z-index: 0; 
    }

    .course-hud {
      position: fixed;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      background: rgba(10, 22, 40, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 14px 20px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .course-hud-left h1 { 
      font-size: 20px; 
      font-weight: 800; 
      margin: 0; 
      color: white; 
      letter-spacing: -0.5px;
    }
    .course-hud-left p { 
      font-size: 12px; 
      font-weight: 500; 
      color: rgba(255,255,255,0.5); 
      margin: 2px 0 0 0;
    }

    .course-hud-right { text-align: right; }
    .course-hud-right .par { 
      font-size: 11px; 
      font-weight: 700; 
      color: #22c55e; 
      background: rgba(34, 197, 94, 0.15); 
      padding: 3px 10px; 
      border-radius: 8px;
    }
    .course-hud-right .dist { 
      font-size: 22px; 
      font-weight: 800; 
      color: white; 
      display: block; 
      margin-top: 6px; 
      font-variant-numeric: tabular-nums;
    }

    .flyover-bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(10, 22, 40, 0.9) 40%, transparent);
      padding: 80px 24px 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    #btn-fly {
      pointer-events: auto;
      width: 100%;
      max-width: 320px;
      padding: 16px 24px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: none;
      border-radius: 100px;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    #btn-fly::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    #btn-fly:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 40px rgba(34, 197, 94, 0.6);
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Progress bar */
    .flight-progress {
      position: fixed;
      top: env(safe-area-inset-top, 80px);
      top: 82px;
      left: 16px;
      right: 16px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      z-index: 10;
      overflow: hidden;
    }

    .flight-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #60a5fa);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Altitude badge */
    .altitude-badge {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 22, 40, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 16px;
      z-index: 10;
      display: flex;
      gap: 16px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
    }

    .altitude-badge span { color: white; font-weight: 700; }
  </style>
</head>
<body>
  <div id="flyover-container"></div>

  <div class="course-hud">
    <div class="course-hud-left">
      <h1 id="hud-hole-name">Hål 1</h1>
      <p id="hud-course-name">Norrmjöle GK</p>
    </div>
    <div class="course-hud-right">
      <span class="par" id="hud-par">PAR 4</span>
      <span class="dist" id="hud-dist">366m</span>
    </div>
  </div>

  <div class="flight-progress">
    <div class="flight-progress-fill" id="progress-fill"></div>
  </div>

  <div class="altitude-badge" id="alt-badge">
    <div>ALT <span id="alt-value">20</span>m</div>
    <div>SPD <span id="spd-value">45</span>km/h</div>
  </div>

  <div class="flyover-bottom-sheet">
    <button id="btn-fly">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span>Starta Drönarflygning</span>
    </button>
  </div>

  <script src="flyover_3d.js"></script>
  <script>
    // Update progress bar during flight
    const progressFill = document.getElementById('progress-fill');
    const altValue = document.getElementById('alt-value');
    const spdValue = document.getElementById('spd-value');

    function updateProgress() {
      if (typeof flyProgress !== 'undefined') {
        progressFill.style.width = (flyProgress * 100) + '%';
        
        // Simulated altitude & speed
        const alt = Math.round(8 + Math.sin(flyProgress * Math.PI) * 15);
        const spd = Math.round(30 + flyProgress * 25 + Math.sin(flyProgress * Math.PI * 3) * 8);
        altValue.textContent = alt;
        spdValue.textContent = spd;
      }
      requestAnimationFrame(updateProgress);
    }
    updateProgress();
  </script>
</body>
</html>
