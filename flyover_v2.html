<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenRead AR — 3D Flyover</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; background:#0a0f1a; font-family:'Inter',system-ui,sans-serif; }
#flyover-container { width:100vw; height:100vh; position:relative; }
canvas { display:block; }

/* HUD */
.hud-bar { position:absolute; top:0; left:0; right:0; height:56px;
  background:linear-gradient(180deg,rgba(10,15,26,0.92) 0%,rgba(10,15,26,0.6) 100%);
  backdrop-filter:blur(12px); display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; z-index:10; border-bottom:1px solid rgba(255,255,255,0.08); }
.hud-left { display:flex; flex-direction:column; gap:1px; }
.hud-hole { font-size:20px; font-weight:700; color:#fff; letter-spacing:-0.5px; }
.hud-course { font-size:12px; color:rgba(255,255,255,0.5); font-weight:400; }
.hud-right { display:flex; align-items:center; gap:16px; }
.hud-par { font-size:13px; color:#22c55e; font-weight:600; letter-spacing:1px; }
.hud-dist { font-size:26px; font-weight:700; color:#fff; letter-spacing:-1px; }

/* Progress bar */
.progress-bar { position:absolute; top:56px; left:0; right:0; height:3px;
  background:rgba(255,255,255,0.06); z-index:10; }
.progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#22c55e,#3b82f6);
  transition:width 0.1s linear; border-radius:0 2px 2px 0; }

/* Flight telemetry */
.telemetry { position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
  display:flex; gap:20px; z-index:10; }
.tele-item { display:flex; align-items:baseline; gap:4px; font-size:12px;
  color:rgba(255,255,255,0.4); letter-spacing:0.5px; }
.tele-item .val { font-size:15px; font-weight:600; color:rgba(255,255,255,0.8); }

/* CTA button */
.cta-wrap { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:10; }
#btn-fly { border:none; padding:14px 48px; border-radius:50px; font-size:15px;
  font-weight:600; color:#fff; cursor:pointer; display:flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,#10B981 0%,#059669 100%);
  box-shadow:0 8px 30px rgba(16,185,129,0.35); transition:all 0.3s ease; letter-spacing:0.3px; }
#btn-fly:hover { transform:scale(1.03); box-shadow:0 12px 40px rgba(16,185,129,0.45); }
</style>
</head>
<body>
<div id="flyover-container">
  <div class="hud-bar">
    <div class="hud-left">
      <div class="hud-hole" id="hud-hole-name">Hål 1</div>
      <div class="hud-course" id="hud-course-name">Norrmjöle GK</div>
    </div>
    <div class="hud-right">
      <div class="hud-par" id="hud-par">PAR 4</div>
      <div class="hud-dist" id="hud-dist">382m</div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="telemetry">
    <div class="tele-item">ALT <span class="val" id="alt-value">0</span>m</div>
    <div class="tele-item">SPD <span class="val" id="spd-value">0</span>km/h</div>
  </div>
  <div class="cta-wrap">
    <button id="btn-fly">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Starta Drönarflygning</span>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================
   GreenRead AR — GolfLogix-Style 3D Flyover v2
   Clean stylized rendering + LiDAR precision
   ============================================ */

let scene, camera, renderer;
let terrainMesh;
let flyProgress = 0, isFlying = false, autoStart = true;
let terrainGrid = null, terrainMeta = null;

const urlParams = new URLSearchParams(window.location.search);
const holeName = urlParams.get('hole') || '1';
const parValue = urlParams.get('par') || '4';
const courseName = urlParams.get('course') ? decodeURIComponent(urlParams.get('course')) : 'Norrmjöle GK';
const totalDist = parseInt(urlParams.get('dist') || '345');

const cameraPath = [];
const FLIGHT_DURATION = 16;
let flightStartTime = 0;

// Hole-specific data (loaded from JSON)
let holeData = null;
let TEE = { x: 37, z: -169 };
let GREEN = { x: -37, z: 169 };

init();

async function init() {
    const container = document.getElementById('flyover-container');

    // ======== SCENE ========
    scene = new THREE.Scene();

    // Clean sky gradient (GolfLogix-style — warm, inviting)
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 2; skyCanvas.height = 512;
    const skyCtx = skyCanvas.getContext('2d');
    const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
    skyGrad.addColorStop(0.0, '#1a2a4a');
    skyGrad.addColorStop(0.2, '#2d4a7a');
    skyGrad.addColorStop(0.4, '#4a7ab0');
    skyGrad.addColorStop(0.55, '#6ba4d4');
    skyGrad.addColorStop(0.7, '#8ec5e8');
    skyGrad.addColorStop(0.82, '#c4dce8');
    skyGrad.addColorStop(0.92, '#e8dcc4');
    skyGrad.addColorStop(1.0, '#d4a868');
    skyCtx.fillStyle = skyGrad;
    skyCtx.fillRect(0, 0, 2, 512);
    scene.background = new THREE.CanvasTexture(skyCanvas);

    scene.fog = new THREE.FogExp2(0x8aadcc, 0.0012);

    // ======== CAMERA ========
    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 3000);

    // ======== RENDERER ========
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // ======== LIGHTING ========
    scene.add(new THREE.AmbientLight(0x8aadcc, 0.5));

    const sun = new THREE.DirectionalLight(0xffecd0, 1.1);
    sun.position.set(-200, 80, -150);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    sun.shadow.camera.left = -400; sun.shadow.camera.right = 400;
    sun.shadow.camera.top = 400; sun.shadow.camera.bottom = -400;
    sun.shadow.camera.far = 800;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    scene.add(new THREE.DirectionalLight(0x88bbdd, 0.25).translateY(200));
    scene.add(new THREE.HemisphereLight(0x87ceeb, 0x2d5a1e, 0.3));

    // ======== LOAD HOLE DATA ========
    try {
        const resp = await fetch('data/hole1_v2.json');
        holeData = await resp.json();
        terrainGrid = holeData.points;
        terrainMeta = holeData.metadata;
        TEE = holeData.metadata.tee_3d;
        GREEN = holeData.metadata.green_3d;
        console.log(`Loaded hole: tee(${TEE.x}, ${TEE.z}) green(${GREEN.x}, ${GREEN.z})`);
        console.log(`Trees: ${holeData.trees.length}, Water: ${holeData.water.length}`);
    } catch (e) {
        console.error('Failed to load hole data:', e);
    }

    // ======== BUILD WORLD ========
    buildStylizedTerrain();
    buildFairwayOverlay();
    buildGreenComplex();
    buildTeeBox();
    buildLiDARTrees();
    buildWater();
    buildDistanceMarkers();

    // ======== CAMERA PATH ========
    setupCameraPath();
    updateHUD();

    window.addEventListener('resize', onResize);
    document.getElementById('btn-fly').addEventListener('click', startFlight);

    if (autoStart) setTimeout(() => startFlight(), 1200);
    animate();
}

// ============================================
// STYLIZED TERRAIN (GolfLogix clean look)
// ============================================
function buildStylizedTerrain() {
    if (!terrainMeta) return;
    const w = terrainMeta.width;
    const d = terrainMeta.depth;
    const res = terrainMeta.resolution;
    const heights = terrainGrid;

    // Extended terrain
    const extFactor = 2.0;
    const extW = w * extFactor, extD = d * extFactor;
    const extRes = 300;

    const geometry = new THREE.PlaneGeometry(extW, extD, extRes, extRes);
    const positions = geometry.attributes.position;
    const colors = new Float32Array(positions.count * 3);

    // Color palette — GolfLogix style
    const ROUGH = new THREE.Color(0x2d6b3a);      // Dark green rough
    const FAIRWAY = new THREE.Color(0x4a9b5a);     // Bright fairway green
    const DEEP_ROUGH = new THREE.Color(0x1a4a25);  // Very dark rough/forest
    const SAND = new THREE.Color(0xd4c090);         // Bunker sand

    for (let i = 0; i < positions.count; i++) {
        const vx = positions.getX(i);
        const vz = positions.getY(i);

        // Lookup height
        const dataX = (vx + w / 2) / w * (res - 1);
        const dataZ = (vz + d / 2) / d * (res - 1);
        const ix = Math.max(0, Math.min(res - 1, Math.round(dataX)));
        const iz = Math.max(0, Math.min(res - 1, Math.round(dataZ)));

        let h = 0;
        const inBounds = Math.abs(vx) <= w/2 && Math.abs(vz) <= d/2;
        if (inBounds && heights[iz] && heights[iz][ix] !== undefined) {
            h = heights[iz][ix];
        } else {
            const edgeDist = Math.max(Math.max(0, Math.abs(vx) - w/2), Math.max(0, Math.abs(vz) - d/2));
            h = 3 + Math.sin(vx * 0.01) * 2 - edgeDist * 0.02;
        }

        positions.setZ(i, h);

        // Color based on position — fairway corridor
        const distToFairway = distanceToFairwayLine(vx, vz);
        let color;

        if (distToFairway < 18) {
            // Fairway — with mowing pattern
            const stripe = Math.sin(vz * 0.15) * 0.5 + 0.5;
            color = FAIRWAY.clone();
            color.r += stripe * 0.02 - 0.01;
            color.g += stripe * 0.03 - 0.015;
        } else if (distToFairway < 30) {
            // Semi-rough
            const t = (distToFairway - 18) / 12;
            color = FAIRWAY.clone().lerp(ROUGH, t);
        } else if (distToFairway < 60) {
            // Rough
            color = ROUGH.clone();
            color.r += (Math.random() - 0.5) * 0.02;
            color.g += (Math.random() - 0.5) * 0.02;
        } else {
            // Deep rough / forest area
            color = DEEP_ROUGH.clone();
            color.r += (Math.random() - 0.5) * 0.02;
            color.g += (Math.random() - 0.5) * 0.03;
        }

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.computeVertexNormals();
    geometry.rotateX(-Math.PI / 2);

    const material = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.9,
        metalness: 0.0,
    });

    terrainMesh = new THREE.Mesh(geometry, material);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);
}

function distanceToFairwayLine(x, z) {
    // Line from tee to green
    const tx = TEE.x, tz = TEE.z;
    const gx = GREEN.x, gz = GREEN.z;
    const dx = gx - tx, dz = gz - tz;
    const len2 = dx * dx + dz * dz;
    const t = Math.max(0, Math.min(1, ((x - tx) * dx + (z - tz) * dz) / len2));
    const px = tx + t * dx, pz = tz + t * dz;
    return Math.sqrt((x - px) * (x - px) + (z - pz) * (z - pz));
}

// ============================================
// FAIRWAY OVERLAY (clean bright strip)
// ============================================
function buildFairwayOverlay() {
    // Subtle fairway strip slightly above terrain for clean look
    const segments = 30;
    const points = [];
    for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const x = TEE.x + (GREEN.x - TEE.x) * t;
        const z = TEE.z + (GREEN.z - TEE.z) * t;
        points.push({ x, z, t });
    }

    // Create fairway shape with variable width
    const shape = new THREE.Shape();
    const halfWidth = (t) => {
        if (t < 0.05) return 5 + t / 0.05 * 12;  // Tee narrowing
        if (t > 0.85) return 17 - (t - 0.85) / 0.15 * 7;  // Approach narrowing
        return 17 + Math.sin(t * Math.PI) * 5;    // Mid fairway widest
    };

    // Forward pass (left side)
    for (let i = 0; i <= segments; i++) {
        const { x, z, t } = points[i];
        const hw = halfWidth(t);
        const perpX = -(GREEN.z - TEE.z) / Math.sqrt((GREEN.x - TEE.x)**2 + (GREEN.z - TEE.z)**2);
        const perpZ = (GREEN.x - TEE.x) / Math.sqrt((GREEN.x - TEE.x)**2 + (GREEN.z - TEE.z)**2);
        if (i === 0) shape.moveTo(x + perpX * hw, z + perpZ * hw);
        else shape.lineTo(x + perpX * hw, z + perpZ * hw);
    }
    // Backward pass (right side)
    for (let i = segments; i >= 0; i--) {
        const { x, z, t } = points[i];
        const hw = halfWidth(t);
        const perpX = -(GREEN.z - TEE.z) / Math.sqrt((GREEN.x - TEE.x)**2 + (GREEN.z - TEE.z)**2);
        const perpZ = (GREEN.x - TEE.x) / Math.sqrt((GREEN.x - TEE.x)**2 + (GREEN.z - TEE.z)**2);
        shape.lineTo(x - perpX * hw, z - perpZ * hw);
    }

    const geom = new THREE.ShapeGeometry(shape);
    geom.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshStandardMaterial({
        color: 0x4daa5a,
        roughness: 0.85,
        transparent: true,
        opacity: 0.6,
        depthWrite: false,
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.y = 0.15; // Slightly above terrain
    mesh.receiveShadow = true;
    scene.add(mesh);
}

// ============================================
// GREEN COMPLEX
// ============================================
function buildGreenComplex() {
    const gy = getTerrainHeight(GREEN.x, GREEN.z);

    // Green surface
    const greenGeom = new THREE.CircleGeometry(15, 48);
    greenGeom.rotateX(-Math.PI / 2);
    const greenMat = new THREE.MeshStandardMaterial({
        color: 0x3dbd5a, roughness: 0.75, metalness: 0.0
    });
    const greenMesh = new THREE.Mesh(greenGeom, greenMat);
    greenMesh.position.set(GREEN.x, gy + 0.2, GREEN.z);
    greenMesh.receiveShadow = true;
    scene.add(greenMesh);

    // Fringe
    const fringeGeom = new THREE.RingGeometry(15, 20, 48);
    fringeGeom.rotateX(-Math.PI / 2);
    const fringeMat = new THREE.MeshStandardMaterial({
        color: 0x3a8a45, roughness: 0.85
    });
    const fringeMesh = new THREE.Mesh(fringeGeom, fringeMat);
    fringeMesh.position.set(GREEN.x, gy + 0.15, GREEN.z);
    scene.add(fringeMesh);

    // Pin/flag
    const poleGeom = new THREE.CylinderGeometry(0.06, 0.06, 2.5, 8);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.4 });
    const pole = new THREE.Mesh(poleGeom, poleMat);
    pole.position.set(GREEN.x + 2, gy + 1.5, GREEN.z - 1);
    pole.castShadow = true;
    scene.add(pole);

    const flagGeom = new THREE.PlaneGeometry(1.2, 0.6);
    const flagMat = new THREE.MeshStandardMaterial({ color: 0xff2222, side: THREE.DoubleSide });
    const flag = new THREE.Mesh(flagGeom, flagMat);
    flag.position.set(GREEN.x + 2.6, gy + 2.5, GREEN.z - 1);
    flag.castShadow = true;
    scene.add(flag);

    // Bunkers around green (realistic positions from satellite)
    const bunkerPositions = [
        { x: GREEN.x - 12, z: GREEN.z + 8, rx: 8, rz: 5 },
        { x: GREEN.x + 10, z: GREEN.z - 5, rx: 6, rz: 7 },
        { x: GREEN.x - 5, z: GREEN.z - 14, rx: 5, rz: 4 },
    ];
    bunkerPositions.forEach(b => {
        const bGeom = new THREE.EllipseCurve(0, 0, b.rx, b.rz, 0, Math.PI * 2, false, 0);
        const pts = bGeom.getPoints(24);
        const bShape = new THREE.Shape(pts);
        const bMeshGeom = new THREE.ShapeGeometry(bShape);
        bMeshGeom.rotateX(-Math.PI / 2);
        const bMat = new THREE.MeshStandardMaterial({ color: 0xd4c090, roughness: 0.95 });
        const bMesh = new THREE.Mesh(bMeshGeom, bMat);
        bMesh.position.set(b.x, getTerrainHeight(b.x, b.z) + 0.1, b.z);
        bMesh.receiveShadow = true;
        scene.add(bMesh);
    });
}

// ============================================
// TEE BOX
// ============================================
function buildTeeBox() {
    const ty = getTerrainHeight(TEE.x, TEE.z);
    const teeGeom = new THREE.BoxGeometry(8, 0.2, 12);
    const teeMat = new THREE.MeshStandardMaterial({ color: 0x3dbd5a, roughness: 0.8 });
    const tee = new THREE.Mesh(teeGeom, teeMat);
    tee.position.set(TEE.x, ty + 0.1, TEE.z);
    tee.receiveShadow = true;
    scene.add(tee);

    // Tee markers
    [-2, 2].forEach(offset => {
        const markerGeom = new THREE.SphereGeometry(0.15, 8, 8);
        const markerMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const marker = new THREE.Mesh(markerGeom, markerMat);
        marker.position.set(TEE.x + offset, ty + 0.3, TEE.z + 5);
        scene.add(marker);
    });
}

// ============================================
// LiDAR TREES — Real positions from point cloud
// ============================================
function buildLiDARTrees() {
    if (!holeData || !holeData.trees) return;
    const trees = holeData.trees;

    // Filter: skip trees on fairway
    const fairwayTrees = trees.filter(t => {
        if (t.h < 4) return false;
        const distFw = distanceToFairwayLine(t.x, t.z);
        if (distFw < 20) return false;
        // Skip trees too close to green
        const dGreen = Math.sqrt((t.x - GREEN.x)**2 + (t.z - GREEN.z)**2);
        if (dGreen < 25) return false;
        return true;
    });

    // Subsample — max 2000 trees for performance
    const maxTrees = 2000;
    const step = Math.max(1, Math.floor(fairwayTrees.length / maxTrees));
    const selectedTrees = fairwayTrees.filter((_, i) => i % step === 0);

    console.log(`Rendering ${selectedTrees.length} trees (from ${fairwayTrees.length} valid, ${trees.length} total)`);

    // Instanced trunk + canopy
    const trunkGeom = new THREE.CylinderGeometry(0.15, 0.25, 1, 6);
    const canopyGeom = new THREE.ConeGeometry(1, 1, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3d1a, roughness: 0.9 });
    const canopyMat = new THREE.MeshStandardMaterial({ color: 0x1a5a28, roughness: 0.85, flatShading: true });

    const trunkMesh = new THREE.InstancedMesh(trunkGeom, trunkMat, selectedTrees.length);
    const canopyMesh = new THREE.InstancedMesh(canopyGeom, canopyMat, selectedTrees.length);
    trunkMesh.castShadow = true;
    canopyMesh.castShadow = true;

    const dummy = new THREE.Object3D();
    const canopyColors = new Float32Array(selectedTrees.length * 3);

    selectedTrees.forEach((t, i) => {
        const h = t.h;
        const groundY = t.g;
        const trunkH = h * 0.3;

        // Trunk
        dummy.position.set(t.x, groundY + trunkH / 2, t.z);
        dummy.scale.set(1, trunkH, 1);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.updateMatrix();
        trunkMesh.setMatrixAt(i, dummy.matrix);

        // Canopy — stacked cones for nordic pine look
        dummy.position.set(t.x, groundY + trunkH + h * 0.35, t.z);
        dummy.scale.set(h * 0.25, h * 0.7, h * 0.25);
        dummy.updateMatrix();
        canopyMesh.setMatrixAt(i, dummy.matrix);

        // Color variation
        const shade = 0.7 + Math.random() * 0.3;
        canopyColors[i * 3] = 0.08 * shade;
        canopyColors[i * 3 + 1] = (0.25 + Math.random() * 0.1) * shade;
        canopyColors[i * 3 + 2] = 0.1 * shade;
    });

    // Apply per-instance colors
    canopyGeom.setAttribute('color', new THREE.InstancedBufferAttribute(canopyColors, 3));

    trunkMesh.instanceMatrix.needsUpdate = true;
    canopyMesh.instanceMatrix.needsUpdate = true;
    scene.add(trunkMesh);
    scene.add(canopyMesh);
}

// ============================================
// WATER (from LiDAR class 9)
// ============================================
function buildWater() {
    if (!holeData || !holeData.water || holeData.water.length === 0) return;

    holeData.water.forEach(w => {
        const wx = (w.min_x + w.max_x) / 2;
        const wz = (w.min_z + w.max_z) / 2;
        const ww = Math.abs(w.max_x - w.min_x);
        const wd = Math.abs(w.max_z - w.min_z);

        const waterGeom = new THREE.PlaneGeometry(ww, wd);
        waterGeom.rotateX(-Math.PI / 2);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x2a5a8a,
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.8,
        });
        const waterMesh = new THREE.Mesh(waterGeom, waterMat);
        waterMesh.position.set(wx, w.elevation + 0.1, wz);
        scene.add(waterMesh);
    });
}

// ============================================
// DISTANCE MARKERS
// ============================================
function buildDistanceMarkers() {
    [100, 150, 200, 250, 300].forEach(d => {
        if (d >= totalDist - 20) return;
        const t = d / totalDist;
        const x = TEE.x + (GREEN.x - TEE.x) * t;
        const z = TEE.z + (GREEN.z - TEE.z) * t;
        const y = getTerrainHeight(x, z);

        // Create sprite
        const canvas = document.createElement('canvas');
        canvas.width = 200; canvas.height = 100;
        const ctx = canvas.getContext('2d');

        // Background
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(10, 10, 180, 80, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Text
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${totalDist - d}`, 100, 55);
        ctx.font = '16px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillText('m', 140, 55);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.set(x, y + 12, z);
        sprite.scale.set(16, 8, 1);
        scene.add(sprite);
    });
}

// ============================================
// CAMERA PATH
// ============================================
function setupCameraPath() {
    const teeY = getTerrainHeight(TEE.x, TEE.z);
    const midY = getTerrainHeight(0, 0);
    const greenY = getTerrainHeight(GREEN.x, GREEN.z);

    cameraPath.push(
        // Establishing — behind and above tee
        { pos: new THREE.Vector3(TEE.x + 30, teeY + 70, TEE.z - 50), look: new THREE.Vector3(0, midY, 50) },
        // Over tee looking down fairway
        { pos: new THREE.Vector3(TEE.x + 10, teeY + 55, TEE.z + 20), look: new THREE.Vector3(0, midY, 100) },
        // Sweeping along fairway
        { pos: new THREE.Vector3(15, midY + 50, -20), look: new THREE.Vector3(-5, midY, 120) },
        // Mid fairway
        { pos: new THREE.Vector3(0, midY + 40, 50), look: new THREE.Vector3(GREEN.x, greenY, GREEN.z) },
        // Approach
        { pos: new THREE.Vector3(GREEN.x + 15, greenY + 35, GREEN.z - 25), look: new THREE.Vector3(GREEN.x, greenY, GREEN.z) },
        // Green beauty shot
        { pos: new THREE.Vector3(GREEN.x, greenY + 50, GREEN.z + 5), look: new THREE.Vector3(GREEN.x, greenY, GREEN.z) },
        // Final orbit
        { pos: new THREE.Vector3(GREEN.x + 20, greenY + 45, GREEN.z + 15), look: new THREE.Vector3(GREEN.x, greenY, GREEN.z) },
    );
}

function startFlight() {
    flyProgress = 0; isFlying = true;
    flightStartTime = performance.now();
    const btn = document.getElementById('btn-fly');
    btn.innerHTML = '<span>🚁 Flyger...</span>';
    btn.style.background = 'linear-gradient(135deg, #3B82F6, #1D4ED8)';
}

function animate() {
    requestAnimationFrame(animate);

    if (isFlying && cameraPath.length > 1) {
        const elapsed = (performance.now() - flightStartTime) / 1000;
        flyProgress = Math.min(elapsed / FLIGHT_DURATION, 1.0);
        const t = smoothstep(0, 1, flyProgress);

        const totalSeg = cameraPath.length - 1;
        const segF = t * totalSeg;
        const segI = Math.min(Math.floor(segF), totalSeg - 1);
        const segT = smoothstep(0, 1, segF - segI);

        const from = cameraPath[segI], to = cameraPath[segI + 1];
        camera.position.lerpVectors(from.pos, to.pos, segT);
        camera.position.x += Math.sin(elapsed * 0.7) * 0.3;
        camera.position.y += Math.sin(elapsed * 0.4) * 0.15;

        const lookTarget = new THREE.Vector3().lerpVectors(from.look, to.look, segT);
        camera.lookAt(lookTarget);

        updateFlightHUD(t, elapsed);
        document.getElementById('progress-fill').style.width = (flyProgress * 100) + '%';

        if (flyProgress >= 1.0) {
            isFlying = false;
            const btn = document.getElementById('btn-fly');
            btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>Spela om</span>';
            btn.style.background = 'linear-gradient(135deg, #10B981, #059669)';
        }
    } else if (!isFlying && cameraPath.length > 0) {
        const time = performance.now() * 0.00006;
        const lw = cameraPath[cameraPath.length - 1];
        camera.position.x = lw.pos.x + Math.sin(time) * 18;
        camera.position.z = lw.pos.z + Math.cos(time) * 12;
        camera.position.y = lw.pos.y + Math.sin(time * 1.5) * 2;
        camera.lookAt(lw.look);
    }

    renderer.render(scene, camera);
}

function smoothstep(min, max, value) {
    const x = Math.max(0, Math.min(1, (value - min) / (max - min)));
    return x * x * (3 - 2 * x);
}

function getTerrainHeight(wx, wz) {
    if (terrainGrid && terrainMeta) {
        const w = terrainMeta.width, d = terrainMeta.depth, res = terrainMeta.resolution;
        const ix = Math.max(0, Math.min(res - 1, Math.round((wx + w/2) / w * (res - 1))));
        const iz = Math.max(0, Math.min(res - 1, Math.round((wz + d/2) / d * (res - 1))));
        if (terrainGrid[iz] && terrainGrid[iz][ix] !== undefined) return terrainGrid[iz][ix];
    }
    return 5 + Math.sin(wx * 0.02) * 1.5;
}

function updateFlightHUD(t, elapsed) {
    const distEl = document.getElementById('hud-dist');
    if (distEl) distEl.textContent = `${Math.round(totalDist * (1 - t))}m`;
    const altEl = document.getElementById('alt-value');
    if (altEl) altEl.textContent = Math.round(10 + Math.sin(t * Math.PI) * 18);
    const spdEl = document.getElementById('spd-value');
    if (spdEl) spdEl.textContent = Math.round(30 + t * 25 + Math.sin(elapsed * 1.5) * 5);
}

function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function updateHUD() {
    const n = document.getElementById('hud-hole-name');
    const c = document.getElementById('hud-course-name');
    const p = document.getElementById('hud-par');
    const d = document.getElementById('hud-dist');
    if (n) n.textContent = `Hål ${holeName}`;
    if (c) c.textContent = courseName;
    if (p) p.textContent = `PAR ${parValue}`;
    if (d) d.textContent = `${totalDist}m`;
}
</script>
