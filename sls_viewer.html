<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLS Klass 1 — 3D LiDAR Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
  canvas { display: block; }
  
  #hud {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 16px 20px; color: #fff; min-width: 260px;
  }
  #hud h1 { font-size: 14px; font-weight: 600; color: #4ade80; margin-bottom: 8px; letter-spacing: 0.5px; }
  #hud .badge { display: inline-block; background: #22c55e; color: #000; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  #hud .row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 12px; }
  #hud .label { color: rgba(255,255,255,0.5); }
  #hud .value { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
  #hud .divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }
  
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 12px 20px; color: rgba(255,255,255,0.6); font-size: 11px;
    display: flex; gap: 20px;
  }
  #controls kbd { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
  
  #loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
    background: #0a0a0f; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff;
  }
  #loading h2 { font-size: 18px; margin-bottom: 20px; color: #4ade80; }
  #loading .bar { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  #loading .fill { height: 100%; background: #4ade80; border-radius: 2px; transition: width 0.3s; width: 0%; }
  #loading .status { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<div id="loading">
  <h2>SLS Klass 1 — LiDAR Punktmoln</h2>
  <div class="bar"><div class="fill" id="load-fill"></div></div>
  <div class="status" id="load-status">Laddar data...</div>
</div>

<div id="hud" style="display:none">
  <h1>🛰️ Lantmäteriet SLS <span class="badge">KLASS 1</span></h1>
  <div class="divider"></div>
  <div class="row"><span class="label">Block</span><span class="value" id="hud-block">25E024</span></div>
  <div class="row"><span class="label">Punkter</span><span class="value" id="hud-points">—</span></div>
  <div class="row"><span class="label">Densitet</span><span class="value" id="hud-density">—</span></div>
  <div class="row"><span class="label">Area</span><span class="value" id="hud-area">—</span></div>
  <div class="divider"></div>
  <div class="row"><span class="label">Mark</span><span class="value" id="hud-ground" style="color:#8b7355">—</span></div>
  <div class="row"><span class="label">Vegetation</span><span class="value" id="hud-veg" style="color:#4ade80">—</span></div>
  <div class="row"><span class="label">Vatten</span><span class="value" id="hud-water" style="color:#60a5fa">—</span></div>
  <div class="divider"></div>
  <div class="row"><span class="label">Punkt-storlek</span><span class="value" id="hud-size">2.0</span></div>
</div>

<div id="controls">
  <span><kbd>Drag</kbd> Rotera</span>
  <span><kbd>Scroll</kbd> Zooma</span>
  <span><kbd>+</kbd>/<kbd>-</kbd> Punkt-storlek</span>
  <span><kbd>G</kbd> Bara mark</span>
  <span><kbd>V</kbd> Bara vegetation</span>
  <span><kbd>A</kbd> Alla punkter</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function() {
  const fill = document.getElementById('load-fill');
  const status = document.getElementById('load-status');
  
  // Load data
  status.textContent = 'Hämtar punktmoln...';
  fill.style.width = '10%';
  
  const resp = await fetch('data/sundsvall_klass1.json');
  fill.style.width = '40%';
  status.textContent = 'Parsear JSON...';
  
  const data = await resp.json();
  fill.style.width = '60%';
  status.textContent = 'Bygger 3D-scen...';
  
  const meta = data.metadata;
  const positions = new Float32Array(data.positions);
  const colors = new Float32Array(data.colors);
  const numPoints = positions.length / 3;
  
  // Scene setup
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0f);
  scene.fog = new THREE.FogExp2(0x0a0a0f, 0.0008);
  
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 2000);
  camera.position.set(200, 150, 200);
  camera.lookAt(0, 10, 0);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  
  fill.style.width = '70%';
  
  // Create point cloud
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  let pointSize = 2.0;
  const material = new THREE.PointsMaterial({
    size: pointSize,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.85,
  });
  
  const points = new THREE.Points(geometry, material);
  scene.add(points);
  
  fill.style.width = '90%';
  
  // Ambient light for atmosphere
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  
  // Ground plane (subtle grid)
  const gridHelper = new THREE.GridHelper(600, 60, 0x333333, 0x1a1a1a);
  gridHelper.position.y = -0.5;
  scene.add(gridHelper);
  
  // Update HUD
  document.getElementById('hud').style.display = 'block';
  document.getElementById('hud-points').textContent = numPoints.toLocaleString();
  document.getElementById('hud-density').textContent = meta.density_pm2 + ' p/m²';
  document.getElementById('hud-area').textContent = meta.area_m + 'm × ' + meta.area_m + 'm';
  document.getElementById('hud-ground').textContent = meta.ground_points.toLocaleString();
  document.getElementById('hud-veg').textContent = meta.vegetation_points.toLocaleString();
  document.getElementById('hud-water').textContent = meta.water_points.toLocaleString();
  
  fill.style.width = '100%';
  status.textContent = 'Klar!';
  setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 500);
  
  // Orbit controls (manual implementation)
  let isDragging = false;
  let prevMouse = { x: 0, y: 0 };
  let spherical = { theta: Math.PI / 4, phi: Math.PI / 4, radius: 350 };
  let target = new THREE.Vector3(0, 20, 0);
  
  function updateCamera() {
    const r = spherical.radius;
    camera.position.set(
      target.x + r * Math.sin(spherical.phi) * Math.cos(spherical.theta),
      target.y + r * Math.cos(spherical.phi),
      target.z + r * Math.sin(spherical.phi) * Math.sin(spherical.theta)
    );
    camera.lookAt(target);
  }
  updateCamera();
  
  renderer.domElement.addEventListener('mousedown', (e) => {
    isDragging = true;
    prevMouse = { x: e.clientX, y: e.clientY };
  });
  
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x;
    const dy = e.clientY - prevMouse.y;
    spherical.theta -= dx * 0.005;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.005));
    prevMouse = { x: e.clientX, y: e.clientY };
    updateCamera();
  });
  
  window.addEventListener('mouseup', () => { isDragging = false; });
  
  renderer.domElement.addEventListener('wheel', (e) => {
    spherical.radius = Math.max(20, Math.min(800, spherical.radius + e.deltaY * 0.3));
    updateCamera();
  });
  
  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (key === '+' || key === '=') {
      pointSize = Math.min(8, pointSize + 0.5);
      material.size = pointSize;
      document.getElementById('hud-size').textContent = pointSize.toFixed(1);
    }
    if (key === '-') {
      pointSize = Math.max(0.5, pointSize - 0.5);
      material.size = pointSize;
      document.getElementById('hud-size').textContent = pointSize.toFixed(1);
    }
    // Filter modes
    if (key === 'g' || key === 'v' || key === 'a') {
      const posArr = geometry.attributes.position.array;
      const colArr = geometry.attributes.color.array;
      // Reset colors from original
      for (let i = 0; i < numPoints; i++) {
        const ci = i * 3;
        colArr[ci] = data.colors[ci];
        colArr[ci+1] = data.colors[ci+1];
        colArr[ci+2] = data.colors[ci+2];
        
        if (key === 'g') {
          // Ground only - hide vegetation (set alpha to 0 by making color dark)
          const isGreen = data.colors[ci+1] > 0.3 && data.colors[ci] < 0.2;
          if (isGreen) { colArr[ci] = 0; colArr[ci+1] = 0; colArr[ci+2] = 0; }
        }
        if (key === 'v') {
          // Vegetation only
          const isGreen = data.colors[ci+1] > 0.3 && data.colors[ci] < 0.2;
          if (!isGreen) { colArr[ci] = 0.02; colArr[ci+1] = 0.02; colArr[ci+2] = 0.02; }
        }
      }
      geometry.attributes.color.needsUpdate = true;
    }
  });
  
  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  // Auto-rotate slowly
  let autoRotate = true;
  renderer.domElement.addEventListener('mousedown', () => { autoRotate = false; });
  
  // Render loop
  function animate() {
    requestAnimationFrame(animate);
    if (autoRotate) {
      spherical.theta += 0.001;
      updateCamera();
    }
    renderer.render(scene, camera);
  }
  animate();
  
})();
</script>
</body>
</html>
